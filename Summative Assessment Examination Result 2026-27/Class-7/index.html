<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 8 Result 2026-27 - Cambridge School</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:15px;
    background:#eaf1fa;
    font-family:Arial,sans-serif;
    color:#172d50;
}

.page{
    max-width:1100px;
    margin:auto;
    background:white;
    border:4px solid #123b78;
    border-radius:12px;
    padding:15px;
}

.header{
    text-align:center;
    border-bottom:3px solid #123b78;
    padding-bottom:12px;
}

.school-logo{
    width:80px;
    height:80px;
    object-fit:contain;
}

.header h1{
    font-size:27px;
    margin:5px 0;
    color:#123b78;
}

.header h2{
    font-size:18px;
    margin:5px 0;
}

.header h3{
    font-size:16px;
    margin:8px 0;
}

.search-area{
    background:#edf5ff;
    padding:15px;
    text-align:center;
    margin:15px 0;
    border:1px solid #9bbce8;
    border-radius:10px;
}

.search-area input{
    width:70%;
    max-width:450px;
    padding:12px;
    font-size:16px;
    border:2px solid #123b78;
    border-radius:7px;
}

.search-area button{
    padding:12px 18px;
    background:#123b78;
    color:white;
    border:0;
    border-radius:7px;
    font-size:15px;
    cursor:pointer;
    margin:5px;
}

#message{
    color:#c00000;
    font-weight:bold;
    margin-top:10px;
}

.report{
    border:2px solid #123b78;
    border-radius:10px;
    padding:12px;
    margin:15px 0;
    page-break-inside:avoid;
}

.student-heading{
    background:linear-gradient(90deg,#123b78,#247ac4);
    color:white;
    padding:10px;
    border-radius:6px;
    font-weight:bold;
    margin-bottom:10px;
}

.student-top{
    display:flex;
    gap:15px;
    align-items:center;
    margin-bottom:12px;
}

.student-photo{
    width:105px;
    height:125px;
    object-fit:cover;
    border:2px solid #123b78;
    border-radius:5px;
    background:#edf2f8;
}

.details{
    flex:1;
    width:100%;
    border-collapse:collapse;
}

.details td{
    border:1px solid #9bbce8;
    padding:8px;
    font-size:13px;
}

.details td:nth-child(odd){
    background:#edf5ff;
    font-weight:bold;
}

.section-title{
    background:#123b78;
    color:white;
    padding:8px;
    margin:12px 0 6px;
    font-weight:bold;
    border-radius:4px;
}

.marks{
    width:100%;
    border-collapse:collapse;
    font-size:11px;
    text-align:center;
}

.marks th{
    background:#123b78;
    color:white;
    padding:7px 2px;
    border:1px solid white;
}

.marks td{
    border:1px solid #a5bddb;
    padding:7px 2px;
}

.marks tbody tr:nth-child(even){
    background:#edf5ff;
}

.total-row{
    background:#fff0bf!important;
    font-weight:bold;
}

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    margin-top:10px;
}

.summary div{
    text-align:center;
    border:1px solid #123b78;
    border-radius:5px;
    overflow:hidden;
}

.summary strong{
    display:block;
    background:#123b78;
    color:white;
    padding:7px 2px;
    font-size:11px;
}

.summary span{
    display:block;
    padding:10px 2px;
    font-size:18px;
    font-weight:bold;
}

.performance{
    border:2px solid #168d9c;
    border-radius:9px;
    padding:10px;
    margin-top:14px;
}

.performance-title{
    background:linear-gradient(90deg,#087f8c,#21b5bd);
    color:white;
    padding:10px;
    border-radius:5px;
    font-weight:bold;
    margin-bottom:10px;
}

.landscapes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.scene{
    position:relative;
    overflow:hidden;
    border:3px solid #d2e2f0;
    border-radius:9px;
    background:#eef6ff;
}

.scene img{
    display:block;
    width:100%;
    height:145px;
    object-fit:cover;
}

.scene-name{
    text-align:center;
    color:white;
    background:#123b78;
    font-weight:bold;
    padding:8px 3px;
}

.tick{
    display:none;
    position:absolute;
    top:8px;
    right:8px;
    width:35px;
    height:35px;
    line-height:31px;
    border-radius:50%;
    background:#00a63c;
    color:white;
    text-align:center;
    font-size:25px;
    font-weight:bold;
    border:2px solid white;
    box-shadow:0 2px 8px #555;
}

.scene.selected{
    border:4px solid #00a63c;
}

.scene.selected .tick{
    display:block;
}

.proficiency{
    background:#edf9ff;
    border:1px solid #9bbce8;
    border-radius:6px;
    padding:10px;
    line-height:1.9;
    margin-top:10px;
}

.remarks{
    border:1px solid #9bbce8;
    min-height:45px;
    padding:10px;
    border-radius:5px;
}

.signatures{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:30px;
    text-align:center;
}

.signature-box{
    min-height:65px;
    font-size:12px;
    font-weight:bold;
    padding-top:35px;
    border-top:1px solid #123b78;
}

.school-seal{
    text-align:center;
    margin-top:12px;
}

.school-seal img{
    max-width:90px;
    max-height:75px;
    object-fit:contain;
}

.footer{
    display:flex;
    justify-content:space-between;
    border-top:1px solid #123b78;
    padding-top:8px;
    margin-top:15px;
    font-size:11px;
}

@media(max-width:650px){
    body{padding:4px}
    .page{padding:6px}
    .header h1{font-size:20px}
    .student-top{gap:7px}
    .student-photo{width:78px;height:100px}
    .details td{font-size:10px;padding:5px 3px}
    .marks{font-size:8px}
    .marks th,.marks td{padding:5px 1px}
    .scene img{height:80px}
    .scene-name{font-size:10px}
    .tick{width:27px;height:27px;line-height:23px;font-size:19px}
    .summary strong{font-size:9px}
    .summary span{font-size:14px}
    .search-area input{width:100%}
}

@media print{
    body{background:white;padding:0}
    .search-area{display:none}
    .page{border:2px solid #123b78}
    .report{break-inside:avoid}
    @page{size:A4 portrait;margin:7mm}
}
</style>
</head>

<body>

<div class="page">

<header class="header">
    <img class="school-logo" src="../../logo.png"
         alt="School Logo"
         onerror="this.style.display='none'">

    <h1>CAMBRIDGE SCHOOL OF MODERN EDUCATION</h1>
    <h2>OTLIGAM BEERWAH</h2>
    <h3>SUMMATIVE ASSESSMENT EXAMINATION RESULT</h3>
    <h3>SESSION 2026–27 | CLASS 8th</h3>
    <b>UDISE CODE: 01040303905</b>
</header>

<div class="search-area">
    <h3>SEARCH STUDENT RESULT</h3>

    <input type="text" id="searchInput"
           placeholder="Enter Student Name or Roll Number">

    <button onclick="searchStudent()">Get Result</button>
    <button onclick="showAll()">Show All</button>
    <button onclick="window.print()">Print Result</button>

    <div id="message"></div>
</div>

<div id="results"></div>

<div class="signatures">
    <div class="signature-box">Form Teacher</div>
    <div class="signature-box">Checked By</div>
    <div class="signature-box">Exam Incharge</div>
    <div class="signature-box">Principal</div>
</div>

<div class="school-seal">
    <img src="../../school-seal.png"
         alt="School Seal"
         onerror="this.style.display='none'">
</div>

<div class="footer">
    <span>Cambridge School of Modern Education</span>
    <span>Session 2026–27</span>
</div>

</div>

<script>
/* LANDSCAPE IMAGES */
const landscapeImages = {
    stream:
    "https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=700",

    mountain:
    "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=700",

    sky:
    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700"
};

/* STUDENT DATA
   Replace details and marks with verified school records.
*/
const students = [
{
    roll:"26CS80001",
    name:"Muzamil Bashir",
    father:"Bashir Ahmad Sheikh",
    mother:"Tabasum",
    dob:"05-01-2012",
    admission:"ADM-8001",

    photo:"../../Admit-Cards/Annual-Examination-2026-27/Class-8/26CS80001.jpg",

    marks:[
        ["English",5,5,4,5,5,4,18,44],
        ["Mathematics",5,4,5,5,4,5,19,46],
        ["Science",4,5,5,4,5,5,18,45],
        ["Social Science",5,5,4,5,5,4,19,43],
        ["Urdu",5,4,5,5,4,5,20,46],
        ["Kashmiri",4,5,5,4,5,5,18,44]
    ]
},

{
    roll:"26CS80002",
    name:"Arsalan Manzoor",
    father:"Manzoor Ahmad",
    mother:"Enter Mother's Name",
    dob:"Enter Date of Birth",
    admission:"ADM-8002",

    photo:"../../Admit-Cards/Annual-Examination-2026-27/Class-8/26CS80002.jpg",

    marks:[
        ["English",5,5,4,5,5,4,18,44],
        ["Mathematics",5,4,5,5,4,5,19,46],
        ["Science",4,5,5,4,5,5,18,45],
        ["Social Science",5,5,4,5,5,4,19,43],
        ["Urdu",5,4,5,5,4,5,20,46],
        ["Kashmiri",4,5,5,4,5,5,18,44]
    ]
}
];

function getGrade(p){
    if(p>=90)return "A+";
    if(p>=80)return "A";
    if(p>=70)return "B+";
    if(p>=60)return "B";
    if(p>=50)return "C";
    return "D";
}

function getProficiency(p){
    if(p>=90)return "Outstanding";
    if(p>=80)return "Excellent";
    if(p>=70)return "Very Good";
    if(p>=60)return "Good";
    if(p>=50)return "Satisfactory";
    return "Needs Improvement";
}

function getLandscape(p){
    if(p<50)return "stream";
    if(p<80)return "mountain";
    return "sky";
}

function renderStudent(s){

    let grandTotal=0;

    const rows=s.marks.map(m=>{
        const fa=m[1]+m[2]+m[3]+m[4]+m[5]+m[6];
        const total=fa+m[7]+m[8];

        grandTotal+=total;

        return `
        <tr>
            <td style="text-align:left">${m[0]}</td>
            <td>${m[1]}</td>
            <td>${m[2]}</td>
            <td>${m[3]}</td>
            <td>${m[4]}</td>
            <td>${m[5]}</td>
            <td>${m[6]}</td>
            <td>${fa}</td>
            <td>${m[7]}</td>
            <td>${m[8]}</td>
            <td><b>${total}</b></td>
            <td>${getGrade(total)}</td>
        </tr>`;
    }).join("");

    const percentage=(grandTotal/600)*100;
    const selected=getLandscape(percentage);

    const landscapeCards=[
        ["stream","STREAM"],
        ["mountain","MOUNTAIN"],
        ["sky","SKY"]
    ].map(([key,label])=>`
        <div class="scene ${selected===key?"selected":""}">
            <span class="tick">✓</span>
            <img src="${landscapeImages[key]}" alt="${label}">
            <div class="scene-name">${label}</div>
        </div>
    `).join("");

    return `
    <section class="report">

        <div class="student-heading">
            STUDENT RESULT — ${s.roll}
        </div>

        <div class="student-top">

            <img class="student-photo"
                 src="${s.photo}"
                 alt="${s.name}"
                 onerror="this.onerror=null;this.src='https://placehold.co/105x125/eaf1fa/123b78?text=Student+Photo'">

            <table class="details">
                <tr>
                    <td>Student Name</td>
                    <td>${s.name}</td>
                </tr>
                <tr>
                    <td>Roll Number</td>
                    <td>${s.roll}</td>
                </tr>
                <tr>
                    <td>Father's Name</td>
                    <td>${s.father}</td>
                </tr>
                <tr>
                    <td>Mother's Name</td>
                    <td>${s.mother}</td>
                </tr>
                <tr>
                    <td>Date of Birth</td>
                    <td>${s.dob}</td>
                </tr>
                <tr>
                    <td>Admission No.</td>
                    <td>${s.admission}</td>
                </tr>
            </table>

        </div>

        <div class="section-title">SCHOLASTIC PERFORMANCE</div>

        <table class="marks">
            <thead>
                <tr>
                    <th>SUBJECT</th>
                    <th>F1<br>/5</th>
                    <th>F2<br>/5</th>
                    <th>F3<br>/5</th>
                    <th>F4<br>/5</th>
                    <th>F5<br>/5</th>
                    <th>F6<br>/5</th>
                    <th>FA<br>/30</th>
                    <th>CCA<br>/20</th>
                    <th>SA<br>/50</th>
                    <th>TOTAL<br>/100</th>
                    <th>GRADE</th>
                </tr>
            </thead>

            <tbody>
                ${rows}
                <tr class="total-row">
                    <td colspan="10">GRAND TOTAL</td>
                    <td>${grandTotal}</td>
                    <td>${getGrade(percentage)}</td>
                </tr>
            </tbody>
        </table>

        <div class="summary">
            <div>
                <strong>GRAND TOTAL</strong>
                <span>${grandTotal}</span>
            </div>
            <div>
                <strong>MAXIMUM MARKS</strong>
                <span>600</span>
            </div>
            <div>
                <strong>PERCENTAGE</strong>
                <span>${percentage.toFixed(2)}%</span>
            </div>
            <div>
                <strong>OVERALL GRADE</strong>
                <span>${getGrade(percentage)}</span>
            </div>
        </div>

        <div class="performance">
            <div class="performance-title">
                PERFORMANCE LEVEL
            </div>

            <div class="landscapes">
                ${landscapeCards}
            </div>

            <div class="proficiency">
                <b>Proficiency:</b> ${getProficiency(percentage)}<br>
                <b>Percentage:</b> ${percentage.toFixed(2)}%<br>
                <b>Overall Grade:</b> ${getGrade(percentage)}<br>
                <b>Total Marks:</b> ${grandTotal}/600
            </div>
        </div>

        <div class="section-title">TEACHER'S REMARKS</div>
        <div class="remarks"></div>

    </section>`;
}

function showAll(){
    document.getElementById("results").innerHTML=
        students.map(renderStudent).join("");

    document.getElementById("message").textContent="";
}

function searchStudent(){

    const query=document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const message=document.getElementById("message");
    const results=document.getElementById("results");

    if(!query){
        message.textContent="Please enter student name or roll number.";
        results.innerHTML="";
        return;
    }

    const found=students.filter(s=>
        s.name.toLowerCase().includes(query) ||
        s.roll.toLowerCase().includes(query)
    );

    if(found.length===0){
        results.innerHTML="";
        message.textContent="No student found. Please check the name or roll number.";
        return;
    }

    message.textContent=found.length+" student(s) found.";
    results.innerHTML=found.map(renderStudent).join("");
}

/* Search when Enter key is pressed */
document.getElementById("searchInput").addEventListener("keydown",function(e){
    if(e.key==="Enter")searchStudent();
});

/* Show both students initially */
showAll();
</script>

</body>
</html>
