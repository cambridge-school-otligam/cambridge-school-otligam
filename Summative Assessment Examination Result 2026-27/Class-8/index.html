/* SEARCH */

}

.search-box p{

}

.search-input{
    width:70%;
    padding:13px;

    border-radius:8px;
    font-size:16px;
    outline:none;
}

.search-input:focus{
    border-color:#003b73;
}

.search-btn,
.download-btn{
    border:none;
    color:white;
    padding:13px 18px;
    border-radius:8px;

    margin:5px;

.search-btn{
    background:#0066b3;
}

.search-btn:hover{

}

.download-btn{
    background:#168a45;

.download-btn:hover{

}

.message{
    margin-top:12px;
    color:#c00000;
    font-weight:bold;
}

/* REPORT CARD */

#resultArea{
    display:none;
}

.report-card{
    width:210mm;
    min-height:297mm;
    margin:20px auto;
    background:white;
    padding:8mm;
    position:relative;
    border:3px solid #0066b3;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
    overflow:hidden;
}

.report-card:before{
    content:"";
    position:absolute;
    inset:4mm;
    border:1px solid #e2ad00;
    pointer-events:none;
}

/* HEADER */

.header{
    text-align:center;
    position:relative;
    padding-bottom:5px;
}

.logo{
    position:absolute;
    left:5px;
    top:0;
    width:75px;
    height:75px;
    object-fit:contain;
}

.school-name{
    color:#003b73;
    font-size:21px;
    font-weight:900;
    padding-left:55px;
    padding-right:55px;
}

.school-location{
    color:#0066a8;
    font-size:15px;
    font-weight:bold;
    margin-top:3px;
}

.school-info{
    font-size:10px;
    margin-top:4px;
}

.session{
    display:inline-block;
    margin-top:5px;
    background:#0066b3;
    color:white;
    padding:5px 18px;
    border-radius:15px;
    font-size:11px;
    font-weight:bold;
}

/* PHOTO */

.photo-box{
    position:absolute;
    right:10px;
    top:8mm;
    width:27mm;
    height:32mm;
    border:2px solid #0066b3;
    border-radius:5px;
    overflow:hidden;
    background:#eee;
}

.photo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TITLE */

.report-title{
    margin-top:8px;
    background:linear-gradient(90deg,#004b88,#008fd5,#004b88);
    color:white;
    border:2px solid #e3b100;
    border-radius:10px;
    text-align:center;
    padding:8px;
    font-size:18px;
    font-weight:bold;
}

/* DETAILS */

.student-details{
    margin-top:8px;
    border:1px solid #168acb;
    border-radius:6px;
    overflow:hidden;
}

.detail-row{
    display:grid;
    grid-template-columns:22% 28% 20% 30%;
}

.detail-cell{
    min-height:25px;
    padding:5px;
    border-right:1px solid #168acb;
    border-bottom:1px solid #168acb;
    font-size:10px;
}

.detail-label{
    background:#dff2fb;
    color:#003b73;
    font-weight:bold;
}

/* MARKS */

.marks-title{
    margin-top:8px;
    font-size:12px;
    color:#003b73;
    font-weight:bold;
}

.marks-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    font-size:8px;
}

.marks-table th{
    background:#0066a8;
    color:white;
    border:1px solid white;
    padding:4px 1px;
    font-size:7.5px;
}

.marks-table td{
    border:1px solid #168acb;
    text-align:center;
    height:25px;
    padding:3px 1px;

.subject{

    background:#edf8fd;

.fa{

.cca{

.sa{

    font-weight:bold;

.total100{
    background:#dceeff;
    font-weight:bold;

.grade{
    background:#eeeaff;
    font-weight:bold;
}

.total-row td{
    background:#087ebd;
    color:white;
    font-weight:bold;
}

/* BOTTOM */

.bottom-section{
    display:grid;
    grid-template-columns:48% 50%;
    gap:2%;
    margin-top:8px;
}

.grade-box,
.performance-box{
    border-radius:6px;
    overflow:hidden;
}

.grade-box{
    border:1px solid #168acb;
}

.performance-box{
    border:1px solid #28a745;
}

.box-heading{
    background:#0066a8;
    color:white;
    padding:6px;
    font-size:10px;
    font-weight:bold;

.performance-heading{

    color:white;
    padding:6px;
    font-size:10px;
    font-weight:bold;

.grade-table,

.grade-table td,

.grade-table th{

}

.performance-table td:first-child{

    font-weight:bold;
}

.performance-table td:last-child{
    background:#fffdf0;
    font-weight:bold;

/* SIGNATURE */

.signature-area{
    margin-top:10px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:8px;
    text-align:center;

.signature-box{
    font-size:8px;
    color:#003b73;

.signature-box img{

    height:32px;

    display:block;
    margin:auto;

.signature-line{
    border-top:1px solid #003b73;
    padding-top:3px;

.signature-sub{

.footer{
    text-align:center;
    margin-top:7px;
    font-size:8px;
    color:#555;
    font-style:italic;

/* PRINT */

@page{

    margin:0;

@media print{

    .search-box{
        display:none !important;
    }

    .report-card{

        min-height:297mm;
        box-shadow:none;
        page-break-after:always;

@media(max-width:700px){

/* =====================================================
   GRADE
===================================================== */

function getGrade(percent){

    if(percent > 90) return "A+";
    if(percent > 80) return "A";
    if(percent > 70) return "B+";
    if(percent > 60) return "B";
    if(percent > 50) return "C+";
    if(percent > 40) return "C";

    return "D";
}


/* =====================================================
   FIND STUDENT
===================================================== */

function findStudent(){

    const input =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const message =
        document.getElementById("message");

    message.innerHTML="";

    if(input === ""){

        message.innerHTML =
        "Please enter Roll Number or Student Name.";

        return;
    }

    let foundStudent = null;

    /* SEARCH BY ROLL OR NAME */

    for(const roll in students){

        const student = students[roll];

        const rollMatch =
            student.roll.toLowerCase() === input;

        const nameMatch =
            student.name.toLowerCase().includes(input);

        if(rollMatch || nameMatch){

            foundStudent = student;
            break;
        }
    }

    if(!foundStudent){

        message.innerHTML =
        "❌ Student not found. Please check Roll Number or Name.";

        document.getElementById("resultArea").style.display="none";

        document.getElementById("downloadBtn").style.display="none";

        return;
    }

    /* SHOW STUDENT */

    showReport(foundStudent);

}


/* =====================================================
   CREATE SUBJECT ROW
===================================================== */

function createSubjectRow(subject,data){

    const fa =
        Number(data.f1) +
        Number(data.f2) +
        Number(data.f3) +
        Number(data.f4) +
        Number(data.f5) +
        Number(data.f6);

    const total =
        fa +
        Number(data.cca) +
        Number(data.sa);

    const grade =
        getGrade(total);

    return `

    <tr>

        <td class="subject">
            ${subject}
        </td>

        <td>${data.f1}</td>
        <td>${data.f2}</td>
        <td>${data.f3}</td>
        <td>${data.f4}</td>
        <td>${data.f5}</td>
        <td>${data.f6}</td>

        <td class="fa">
            ${fa}
        </td>

        <td class="cca">
            ${data.cca}
        </td>

        <td class="sa">
            ${data.sa}
        </td>

        <td class="total100">
            ${total}
        </td>

        <td class="grade">
            ${grade}
        </td>

    </tr>

    `;
}

                    src="Principal-sign.png"
                    onerror="this.style.display='none'"
                >

                <div class="signature-line">
                    Principal / HOI
                </div>

                <div class="signature-sub">
                    Signature & School Seal
                </div>

            </div>

        </div>


        <div class="footer">
            Education Builds a Better Tomorrow
        </div>

    </div>

    `;


    document.getElementById("resultArea").style.display="block";

    document.getElementById("downloadBtn").style.display="inline-block";

    document.getElementById("message").innerHTML =
        "✅ Result found: " + student.name;

}


/* =====================================================
   DOWNLOAD PDF
===================================================== */

async function downloadPDF(){

    const card =
        document.getElementById("printCard");

    if(!card){

        alert("Please search a student first.");

        return;
    }

    const button =
        document.getElementById("downloadBtn");

    button.innerHTML =
        "⏳ Preparing PDF...";

    button.disabled=true;


    try{

        const canvas =
            await html2canvas(card,{
                scale:2,
                useCORS:true,
                backgroundColor:"#ffffff"
            });


        const imgData =
            canvas.toDataURL("image/jpeg",0.95);


        const {
            jsPDF
        } = window.jspdf;


        const pdf =
            new jsPDF(
                "p",
                "mm",
                "a4"
            );


        const pageWidth =
            210;

        const pageHeight =
            297;


        const imgWidth =
            pageWidth;

        const imgHeight =
            canvas.height *
            imgWidth /
            canvas.width;


        let height =
            imgHeight;


        if(height > pageHeight){

            height = pageHeight;

        }


        pdf.addImage(
            imgData,
            "JPEG",
            0,
            0,
            imgWidth,
            height
        );


        const studentName =
            document
            .querySelector(".school-name")
            ? "Report-Card"
            : "Student";


        pdf.save(
            studentName +
            "-2026-27.pdf"
        );


    }
    catch(error){

        console.error(error);

        alert(
            "PDF download failed. Please try again."
        );

    }


    button.innerHTML =
        "📥 Download PDF";

    button.disabled=false;

}
