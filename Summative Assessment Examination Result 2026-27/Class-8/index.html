<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students Progress Report Card 2026-27</title>

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#e9f1f8;
    font-family:Arial, Helvetica, sans-serif;
    color:#123;
}

/* =========================
   SEARCH AREA
========================= */

.search-box{
    max-width:800px;
    margin:0 auto 20px;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    text-align:center;
}

.search-box h2{
    margin:0 0 15px;
    color:#003b73;
}

.search-box input{
    width:70%;
    padding:12px;
    border:2px solid #168acb;
    border-radius:8px;
    font-size:16px;
}

.search-box button{
    padding:12px 20px;
    margin-left:5px;
    border:0;
    border-radius:8px;
    background:#0066b3;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.search-box button:hover{
    background:#004d87;
}

/* =========================
   REPORT CARD
========================= */

.report-card{
    width:210mm;
    min-height:297mm;
    margin:20px auto;
    background:white;
    position:relative;
    overflow:hidden;
    padding:9mm;

    border:3px solid #0066b3;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}

/* Decorative border */

.report-card::before{
    content:"";
    position:absolute;
    inset:4mm;
    border:1px solid #e2a900;
    pointer-events:none;
}

/* =========================
   HEADER
========================= */

.header{
    position:relative;
    text-align:center;
    padding-bottom:8px;
}

.logo{
    width:80px;
    height:80px;
    object-fit:contain;
    position:absolute;
    left:5px;
    top:0;
}

.school-name{
    margin:0;
    color:#003b73;
    font-size:23px;
    font-weight:900;
    text-transform:uppercase;
}

.school-location{
    margin-top:3px;
    font-size:17px;
    color:#075b9a;
    font-weight:bold;
}

.school-info{
    margin-top:5px;
    font-size:11px;
    color:#333;
}

.session{
    display:inline-block;
    margin-top:6px;
    background:#0066b3;
    color:white;
    padding:5px 20px;
    border-radius:15px;
    font-weight:bold;
    font-size:13px;
}

/* =========================
   TITLE
========================= */

.report-title{
    margin-top:8px;
    background:linear-gradient(90deg,#004b88,#008fd5,#004b88);
    color:white;
    border-radius:12px;
    padding:9px;
    text-align:center;
    font-size:20px;
    font-weight:900;
    border:2px solid #e3b100;
    letter-spacing:.5px;
}

/* =========================
   STUDENT PHOTO
========================= */

.photo-box{
    position:absolute;
    right:10px;
    top:9mm;
    width:28mm;
    height:34mm;
    border:2px solid #0066b3;
    border-radius:6px;
    background:#eee;
    overflow:hidden;
}

.photo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   STUDENT DETAILS
========================= */

.student-details{
    margin-top:10px;
    border:1.5px solid #168acb;
    border-radius:7px;
    overflow:hidden;
}

.detail-row{
    display:grid;
    grid-template-columns:25% 25% 20% 30%;
    min-height:27px;
}

.detail-cell{
    border-right:1px solid #168acb;
    border-bottom:1px solid #168acb;
    padding:6px;
    font-size:11px;
}

.detail-cell:last-child{
    border-right:0;
}

.detail-label{
    background:#dff2fb;
    font-weight:bold;
    color:#003b73;
}

/* =========================
   MARKS TABLE
========================= */

.marks-title{
    margin-top:10px;
    margin-bottom:4px;
    color:#003b73;
    font-weight:bold;
    font-size:13px;
}

.marks-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    font-size:9px;
}

.marks-table th{
    background:#0066a8;
    color:white;
    border:1px solid white;
    padding:5px 2px;
    text-align:center;
    font-size:8.5px;
}

.marks-table td{
    border:1px solid #168acb;
    text-align:center;
    padding:6px 2px;
    height:27px;
}

.marks-table td.subject{
    text-align:left;
    padding-left:7px;
    font-weight:bold;
    color:#003b73;
    background:#edf8fd;
}

/* different column backgrounds */

.f1{background:#dff4ff !important;}
.f2{background:#e7f8e1 !important;}
.f3{background:#fff4c7 !important;}
.f4{background:#f3e5ff !important;}
.f5{background:#ffe9d6 !important;}
.f6{background:#e4f0ff !important;}

.fa{
    background:#d8f1ff !important;
    font-weight:bold;
}

.cca{
    background:#e6f7dd !important;
    font-weight:bold;
}

.sa{
    background:#fff0cf !important;
    font-weight:bold;
}

.final-total{
    background:#cfeeff !important;
    font-weight:bold;
}

.grade{
    background:#e8e8ff !important;
    font-weight:bold;
}

/* total row */

.total-row td{
    background:#087ebd !important;
    color:white;
    font-weight:bold;
}

/* =========================
   BOTTOM SECTION
========================= */

.bottom-section{
    display:grid;
    grid-template-columns:48% 50%;
    gap:2%;
    margin-top:10px;
}

/* =========================
   GRADE KEY
========================= */

.grade-box{
    border:1.5px solid #168acb;
    border-radius:7px;
    overflow:hidden;
}

.box-heading{
    background:#0066a8;
    color:white;
    padding:7px;
    font-weight:bold;
    font-size:12px;
}

.grade-table{
    width:100%;
    border-collapse:collapse;
    font-size:9px;
}

.grade-table th,
.grade-table td{
    border:1px solid #168acb;
    padding:5px;
}

.grade-table th{
    background:#dff2fb;
    color:#003b73;
}

/* =========================
   PERFORMANCE BOX
========================= */

.performance-box{
    border:1.5px solid #28a745;
    border-radius:7px;
    overflow:hidden;
}

.performance-heading{
    background:#168d42;
    color:white;
    padding:7px;
    font-weight:bold;
    font-size:12px;
}

.performance-table{
    width:100%;
    border-collapse:collapse;
    font-size:10px;
}

.performance-table td{
    border:1px solid #78b88d;
    padding:7px;
}

.performance-table td:first-child{
    width:58%;
    background:#e8f5ec;
    font-weight:bold;
}

.performance-table td:last-child{
    background:#fffdf0;
    font-weight:bold;
}

/* =========================
   SIGNATURE AREA
========================= */

.signature-area{
    margin-top:13px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:12px;
    text-align:center;
}

.signature-box{
    font-size:9px;
    color:#003b73;
}

.signature-box img{
    width:80px;
    height:38px;
    object-fit:contain;
    display:block;
    margin:auto;
}

.signature-line{
    border-top:1px solid #003b73;
    margin-top:2px;
    padding-top:4px;
    font-weight:bold;
}

.signature-sub{
    font-size:8px;
}

/* =========================
   SEAL
========================= */

.seal-box{
    text-align:center;
}

.seal-box img{
    width:60px;
    height:60px;
    object-fit:contain;
}

/* =========================
   FOOTER
========================= */

.footer{
    margin-top:8px;
    text-align:center;
    color:#555;
    font-size:8px;
    font-style:italic;
}

/* =========================
   HIDDEN
========================= */

#resultArea{
    display:none;
}

/* =========================
   PRINT
========================= */

@page{
    size:A4 portrait;
    margin:0;
}

@media print{

    body{
        margin:0;
        padding:0;
        background:white;
    }

    .search-box{
        display:none !important;
    }

    .report-card{
        margin:0;
        width:210mm;
        min-height:297mm;
        box-shadow:none;
        border:2px solid #0066b3;
        page-break-after:always;
    }

    #resultArea{
        display:block !important;
    }

}

@media(max-width:700px){

    body{
        padding:5px;
    }

    .report-card{
        width:100%;
        min-height:auto;
        padding:12px;
        transform:none;
    }

    .logo{
        position:static;
        display:block;
        margin:auto;
    }

    .photo-box{
        position:static;
        margin:10px auto;
    }

    .school-name{
        font-size:18px;
    }

    .student-details{
        overflow-x:auto;
    }

    .marks-table{
        font-size:7px;
    }

    .marks-table th{
        font-size:7px;
    }

    .bottom-section{
        grid-template-columns:1fr;
    }

    .signature-area{
        grid-template-columns:1fr 1fr;
    }

    .search-box input{
        width:100%;
        margin-bottom:8px;
    }

    .search-box button{
        width:100%;
        margin:0;
    }

}

</style>

</head>

<body>


<!-- =========================
     SEARCH
========================= -->

<div class="search-box">

<h2>Students Progress Report Card</h2>

<input
    type="text"
    id="searchInput"
    placeholder="Enter Roll Number or Student Name"
>

<button onclick="findStudent()">
    Search Result
</button>

</div>


<div id="resultArea"></div>


<script>

/* =====================================================
   STUDENT DATA
   Add your students here
===================================================== */

const students = {

"26CS8001":{

    name:"Muzamil Bashir",
    father:"Bashir Ahmad",
    mother:"Mother Name",
    dob:"01-01-2014",
    className:"8th",
    roll:"26CS8001",
    admission:"ADM-8001",

    photo:"photos/26CS8001.jpg",

    marks:{

        English:{
            f1:5,
            f2:5,
            f3:5,
            f4:5,
            f5:5,
            f6:5,
            cca:20,
            sa:50
        },

        Mathematics:{
            f1:5,
            f2:5,
            f3:5,
            f4:5,
            f5:5,
            f6:5,
            cca:20,
            sa:50
        },

        Science:{
            f1:5,
            f2:5,
            f3:5,
            f4:5,
            f5:5,
            f6:5,
            cca:20,
            sa:50
        },

        "Social Science":{
            f1:5,
            f2:5,
            f3:5,
            f4:5,
            f5:5,
            f6:5,
            cca:20,
            sa:50
        },

        Urdu:{
            f1:5,
            f2:5,
            f3:5,
            f4:5,
            f5:5,
            f6:5,
            cca:20,
            sa:50
        },

        Kashmiri:{
            f1:5,
            f2:5,
            f3:5,
            f4:5,
            f5:5,
            f6:5,
            cca:20,
            sa:50
        }

    }

}

};


/* =====================================================
   GRADE FUNCTION
===================================================== */

function getGrade(percentage){

    if(percentage > 90) return "A+";
    if(percentage > 80) return "A";
    if(percentage > 70) return "B+";
    if(percentage > 60) return "B";
    if(percentage > 50) return "C+";
    if(percentage > 40) return "C";

    return "D";
}


/* =====================================================
   CREATE MARKS ROW
===================================================== */

function createSubjectRow(subject,data){

    const fa =
        Number(data.f1) +
        Number(data.f2) +
        Number(data.f3) +
        Number(data.f4) +
        Number(data.f5) +
        Number(data.f6);

    const total =
        fa +
        Number(data.cca) +
        Number(data.sa);

    const grade = getGrade(total);

    return `

    <tr>

        <td class="subject">
            ${subject}
        </td>

        <td>${data.f1}</td>
        <td>${data.f2}</td>
        <td>${data.f3}</td>
        <td>${data.f4}</td>
        <td>${data.f5}</td>
        <td>${data.f6}</td>

        <td class="fa">
            ${fa}
        </td>

        <td class="cca">
            ${data.cca}
        </td>

        <td class="sa">
            ${data.sa}
        </td>

        <td class="final-total">
            ${total}
        </td>

        <td class="grade">
            ${grade}
        </td>

    </tr>

    `;
}


/* =====================================================
   FIND STUDENT
===================================================== */

function findStudent(){

    const input =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if(!input){

        alert("Please enter Roll Number or Student Name.");
        return;

    }

    let student = null;

    for(const key in students){

        const s = students[key];

        if(
            key.toLowerCase() === input ||
            s.name.toLowerCase().includes(input)
        ){

            student = s;
            break;

        }

    }

    if(!student){

        alert("Student not found.");
        return;

    }

    showReport(student);

}


/* =====================================================
   SHOW REPORT CARD
===================================================== */

function showReport(student){

    const subjects = [
        "English",
        "Mathematics",
        "Science",
        "Social Science",
        "Urdu",
        "Kashmiri"
    ];

    let subjectRows = "";

    let grandTotal = 0;

    subjects.forEach(subject => {

        const data = student.marks[subject];

        const fa =
            Number(data.f1) +
            Number(data.f2) +
            Number(data.f3) +
            Number(data.f4) +
            Number(data.f5) +
            Number(data.f6);

        const total =
            fa +
            Number(data.cca) +
            Number(data.sa);

        grandTotal += total;

        subjectRows += createSubjectRow(subject,data);

    });


    const maximumMarks =
        subjects.length * 100;

    const percentage =
        (grandTotal / maximumMarks) * 100;

    const overallGrade =
        getGrade(percentage);


    document.getElementById("resultArea").style.display="block";


    document.getElementById("resultArea").innerHTML = `

    <div class="report-card">

        <!-- HEADER -->

        <div class="header">

            <img
                src="logo.png"
                class="logo"
            >

            <div class="school-name">
                CAMBRIDGE SCHOOL OF MODERN EDUCATION
            </div>

            <div class="school-location">
                OTLIGAM BEERWAH
            </div>

            <div class="school-info">
                ZONE: BEERWAH &nbsp; | &nbsp;
                UDISE CODE: 01040303905
            </div>

            <div class="session">
                Academic Session: 2026 – 27
            </div>

        </div>


        <!-- PHOTO -->

        <div class="photo-box">

            <img
                src="${student.photo}"
                onerror="this.src='logo.png'"
            >

        </div>


        <!-- TITLE -->

        <div class="report-title">
            STUDENTS PROGRESS REPORT CARD
        </div>


        <!-- STUDENT DETAILS -->

        <div class="student-details">

            <div class="detail-row">

                <div class="detail-cell detail-label">
                    Student Name
                </div>

                <div class="detail-cell">
                    ${student.name}
                </div>

                <div class="detail-cell detail-label">
                    Class
                </div>

                <div class="detail-cell">
                    ${student.className}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-cell detail-label">
                    Father's Name
                </div>

                <div class="detail-cell">
                    ${student.father}
                </div>

                <div class="detail-cell detail-label">
                    Roll No.
                </div>

                <div class="detail-cell">
                    ${student.roll}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-cell detail-label">
                    Mother's Name
                </div>

                <div class="detail-cell">
                    ${student.mother}
                </div>

                <div class="detail-cell detail-label">
                    Adm. No.
                </div>

                <div class="detail-cell">
                    ${student.admission}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-cell detail-label">
                    Academic Session
                </div>

                <div class="detail-cell">
                    2026–27
                </div>

                <div class="detail-cell detail-label">
                    D.O.B.
                </div>

                <div class="detail-cell">
                    ${student.dob}
                </div>

            </div>

        </div>


        <!-- MARKS -->

        <div class="marks-title">
            Academic Performance
        </div>


        <table class="marks-table">

            <colgroup>

                <col style="width:19%">
                <col style="width:6%">
                <col style="width:6%">
                <col style="width:6%">
                <col style="width:6%">
                <col style="width:6%">
                <col style="width:6%">
                <col style="width:9%">
                <col style="width:10%">
                <col style="width:10%">
                <col style="width:11%">
                <col style="width:7%">

            </colgroup>


            <thead>

                <tr>

                    <th>Subject</th>

                    <th class="f1">
                        F1<br>(5)
                    </th>

                    <th class="f2">
                        F2<br>(5)
                    </th>

                    <th class="f3">
                        F3<br>(5)
                    </th>

                    <th class="f4">
                        F4<br>(5)
                    </th>

                    <th class="f5">
                        F5<br>(5)
                    </th>

                    <th class="f6">
                        F6<br>(5)
                    </th>

                    <th class="fa">
                        Total FA<br>(30)
                    </th>

                    <th class="cca">
                        Co-Curricular<br>
                        Activities<br>
                        (20)
                    </th>

                    <th class="sa">
                        Summative<br>
                        Assessment<br>
                        (50)
                    </th>

                    <th class="final-total">
                        Total<br>
                        FA + CCA + SA<br>
                        (100)
                    </th>

                    <th class="grade">
                        Grade
                    </th>

                </tr>

            </thead>


            <tbody>

                ${subjectRows}


                <tr class="total-row">

                    <td>
                        GRAND TOTAL
                    </td>

                    <td colspan="6">
                        —
                    </td>

                    <td>
                        —
                    </td>

                    <td>
                        —
                    </td>

                    <td>
                        —
                    </td>

                    <td>
                        ${grandTotal}
                    </td>

                    <td>
                        ${overallGrade}
                    </td>

                </tr>

            </tbody>

        </table>


        <!-- BOTTOM -->

        <div class="bottom-section">


            <!-- GRADE KEY -->

            <div class="grade-box">

                <div class="box-heading">
                    📊 Percentage / Grade Key
                </div>

                <table class="grade-table">

                    <tr>
                        <th>Percentage</th>
                        <th>Grade</th>
                    </tr>

                    <tr>
                        <td>&gt; 90% to 100%</td>
                        <td>A+</td>
                    </tr>

                    <tr>
                        <td>&gt; 80% to 90%</td>
                        <td>A</td>
                    </tr>

                    <tr>
                        <td>&gt; 70% to 80%</td>
                        <td>B+</td>
                    </tr>

                    <tr>
                        <td>&gt; 60% to 70%</td>
                        <td>B</td>
                    </tr>

                    <tr>
                        <td>&gt; 50% to 60%</td>
                        <td>C+</td>
                    </tr>

                    <tr>
                        <td>&gt; 40% to 50%</td>
                        <td>C</td>
                    </tr>

                    <tr>
                        <td>Below 40%</td>
                        <td>D</td>
                    </tr>

                </table>

            </div>


            <!-- PERFORMANCE -->

            <div class="performance-box">

                <div class="performance-heading">
                    🏆 Academic Performance
                </div>

                <table class="performance-table">

                    <tr>

                        <td>
                            Total Marks Obtained
                        </td>

                        <td>
                            ${grandTotal}
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Maximum Marks
                        </td>

                        <td>
                            ${maximumMarks}
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Overall Percentage
                        </td>

                        <td>
                            ${percentage.toFixed(2)}%
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Overall Grade
                        </td>

                        <td>
                            ${overallGrade}
                        </td>

                    </tr>


                    <tr>

                        <td>
                            Result
                        </td>

                        <td>
                            ${percentage >= 40 ? "PASS" : "NEEDS IMPROVEMENT"}
                        </td>

                    </tr>

                </table>

            </div>

        </div>


        <!-- SIGNATURES -->

        <div class="signature-area">


            <div class="signature-box">

                <img
                    src="teacher-sign.png"
                    onerror="this.style.display='none'"
                >

                <div class="signature-line">
                    Form Teacher
                </div>

                <div class="signature-sub">
                    Signature
                </div>

            </div>


            <div class="signature-box">

                <img
                    src="checked-sign.png"
                    onerror="this.style.display='none'"
                >

                <div class="signature-line">
                    Checked By
                </div>

                <div class="signature-sub">
                    Signature
                </div>

            </div>


            <div class="signature-box seal-box">

                <img
                    src="school-seal.png"
                    onerror="this.style.display='none'"
                >

                <div class="signature-line">
                    Exam Incharge
                </div>

                <div class="signature-sub">
                    Signature
                </div>

            </div>


            <div class="signature-box">

                <img
                    src="Principal-sign.png"
                    onerror="this.style.display='none'"
                >

                <div class="signature-line">
                    Principal / HOI
                </div>

                <div class="signature-sub">
                    Signature & School Seal
                </div>

            </div>

        </div>


        <div class="footer">
            Education Builds a Better Tomorrow
        </div>


    </div>

    `;

}


/* =====================================================
   ENTER KEY SEARCH
===================================================== */

document.getElementById("searchInput")
.addEventListener("keypress",function(event){

    if(event.key === "Enter"){
        findStudent();
    }

});

</script>

</body>
</html>
