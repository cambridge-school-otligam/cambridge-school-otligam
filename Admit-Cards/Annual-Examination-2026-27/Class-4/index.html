<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 4 Admit Card - Cambridge School</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#dbeafe,#eef6ff,#dbeafe);
}


/* SEARCH BOX */

.search-box{

max-width:900px;
margin:auto;
background:white;
padding:25px;
text-align:center;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,.15);

}

.search-box h1{

color:#002060;
margin:5px;

}

.search-box p{

color:#555;

}


input{

width:300px;
max-width:90%;
padding:12px;
border:1px solid #aaa;
border-radius:6px;
font-size:15px;

}


button{

padding:12px 18px;
margin:6px;
border:0;
border-radius:6px;
background:#002060;
color:white;
cursor:pointer;

}


.all-btn{

background:#008000;

}


.back-btn{

background:#c00000;

}


/* ADMIT CARD */

.admit-card{

display:none;

width:200mm;
max-width:100%;

margin:20px auto;

background:linear-gradient(
135deg,
#ffffff,
#eef6ff,
#dceeff
);

border:4px solid #002060;

border-radius:12px;

padding:15px;

box-shadow:0 5px 18px rgba(0,0,0,.18);

}


/* HEADER */

.header{

text-align:center;

position:relative;

padding-bottom:10px;

border-bottom:3px solid #002060;

min-height:105px;

}


.logo{

position:absolute;

left:5px;

top:0;

width:75px;

height:75px;

object-fit:contain;

}


.school-name{

font-size:25px;

font-weight:bold;

color:#002060;

padding-left:85px;

padding-right:85px;

}


.school-address{

margin-top:5px;

font-size:13px;

font-weight:bold;

}


.udise{

margin-top:4px;

font-size:12px;

font-weight:bold;

}


.exam-title{

display:inline-block;

margin-top:8px;

padding:7px 20px;

background:#002060;

color:white;

border-radius:6px;

font-size:17px;

font-weight:bold;

}


.exam-year{

margin-top:5px;

font-weight:bold;

font-size:12px;

}


/* STUDENT AREA */


.student-area{

display:flex;

gap:12px;

margin-top:10px;

}


.details{

flex:1;

}


.info-table{

width:100%;

border-collapse:collapse;

}


.info-table td{

border:1px solid #789;

padding:6px;

font-size:12px;

background:rgba(255,255,255,.85);

}


.label{

width:32%;

background:#dbeafe !important;

color:#002060;

font-weight:bold;

}


/* PHOTO */


.photo-section{

width:110px;

text-align:center;

}


.photo-box{

width:85px;

height:105px;

margin:auto;

border:3px solid #002060;

display:flex;

align-items:center;

justify-content:center;

background:#f4f8ff;

overflow:hidden;

}


.photo-box img{

width:100%;

height:100%;

object-fit:cover;

}


.photo-text{

margin-top:4px;

font-size:10px;

font-weight:bold;

color:#002060;

}
