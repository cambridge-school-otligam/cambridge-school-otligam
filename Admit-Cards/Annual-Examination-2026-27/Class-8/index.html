<!-- =========================
     LIBRARIES
========================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

/* =========================
   GLOBAL
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left,#dbeafe 0%,transparent 35%),
        radial-gradient(circle at bottom right,#dcfce7 0%,transparent 35%),
        linear-gradient(135deg,#eff6ff,#f8fafc);
    color:#111827;
}

/* =========================
   CONTROL PANEL
========================= */

.controls{
    max-width:900px;
    margin:0 auto 25px;
    padding:20px;
    background:white;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    text-align:center;
}

.controls h2{
    margin:0 0 15px;
    color:#123b70;
}

.search-row{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
}

#search{
    width:330px;
    max-width:100%;
    padding:13px 15px;
    border:2px solid #2563eb;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

button{
    border:none;
    border-radius:10px;
    padding:13px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:#2563eb;
}

button:hover{
    opacity:.9;
}

.btn-all{
    background:#15803d;
}

.btn-print{
    background:#7c3aed;
}

.status{
    margin-top:15px;
    font-weight:bold;
    min-height:22px;
}

/* =========================
   SCREEN CARD
========================= */

#result{
    width:100%;
}

.admit-card{
    width:200mm;
    min-height:138mm;
    margin:20px auto;
    padding:7mm;
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(239,246,255,.98),
            rgba(255,255,255,.98),
            rgba(240,253,244,.98)
        );

    border:2px solid #123b70;
    border-radius:12px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.15);

    color:#111827;
}

/* Decorative border */

.admit-card::before{
    content:"";
    position:absolute;
    inset:4px;
    border:1px solid #d4af37;
    border-radius:8px;
    pointer-events:none;
}

/* =========================
   HEADER
========================= */

.card-header{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    border-bottom:2px solid #123b70;
    padding-bottom:6px;
}

.school-logo{
    width:58px;
    height:58px;
    object-fit:contain;
    flex-shrink:0;
}

.school-title{
    text-align:center;
}

.school-title h1{
    margin:0;
    font-size:21px;
    font-weight:800;
    color:#123b70;
    letter-spacing:.3px;
}

.school-title h2{
    margin:3px 0;
    font-size:14px;
    color:#b45309;
}

.school-title p{
    margin:0;
    font-size:10px;
    font-weight:bold;
}

/* =========================
   EXAM TITLE
========================= */

.exam-title{
    position:relative;
    z-index:2;
    text-align:center;
    margin:6px 0;
}

.exam-title h3{
    display:inline-block;
    margin:0;
    padding:5px 18px;
    border-radius:20px;
    background:#123b70;
    color:white;
    font-size:14px;
    letter-spacing:.4px;
}

.exam-title p{
    margin:3px 0 0;
    font-size:11px;
    font-weight:bold;
    color:#374151;
}

/* =========================
   MAIN CONTENT
========================= */

.card-main{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:1fr 30mm;
    gap:7mm;
    margin-top:5px;
}

/* Student details */

.details{
    width:100%;
}

.detail-row{
    display:grid;
    grid-template-columns:34mm 5mm 1fr;
    min-height:22px;
    align-items:center;
    border-bottom:1px solid #d1d5db;
    font-size:11px;
}

.detail-label{
    font-weight:bold;
    color:#123b70;
}

.detail-colon{
    font-weight:bold;
}

.detail-value{
    font-weight:600;
    word-break:break-word;
}

/* =========================
   PHOTO
========================= */

.photo-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
}

.student-photo{
    width:27mm;
    height:34mm;
    object-fit:cover;
    object-position:center;
    border:2px solid #123b70;
    border-radius:5px;
    background:white;
    display:block;
}

.photo-label{
    margin-top:3px;
    font-size:8px;
    font-weight:bold;
}

/* =========================
   BOTTOM AREA
========================= */

.bottom-section{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:end;
    gap:10px;
    margin-top:5px;
    min-height:31mm;
}

/* Signature boxes */

.signature-box{
    height:28mm;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    text-align:center;
    position:relative;
}

.signature-image{
    width:35mm;
    height:15mm;
    object-fit:contain;
    display:block;

    /* Important for html2canvas */
    mix-blend-mode:normal;
    background:transparent;
}

.signature-line{
    width:42mm;
    border-top:1px solid #111827;
    margin-top:1px;
}

.signature-title{
    font-size:8px;
    font-weight:bold;
    margin-top:2px;
}

/* Seal */

.seal-box{
    height:28mm;
    display:flex;
    align-items:center;
    justify-content:center;
}

.school-seal{
    width:25mm;
    height:25mm;
    object-fit:contain;
    display:block;

    /* Important for html2canvas */
    mix-blend-mode:normal;
    background:transparent;
}

/* =========================
   NOTE
========================= */

.note{
    position:relative;
    z-index:2;
    margin-top:2px;
    padding:4px 7px;
    border-radius:5px;
    background:rgba(219,234,254,.65);
    border:1px solid #93c5fd;
    font-size:8px;
    line-height:1.3;
}

.note strong{
    color:#123b70;
}

/* =========================
   CARD FOOTER
========================= */

.card-footer{
    position:relative;
    z-index:2;
    margin-top:4px;
    text-align:center;
    font-size:7px;
    font-weight:bold;
    color:#374151;
}

/* =========================
   NOT FOUND
========================= */

.not-found{
    max-width:600px;
    margin:30px auto;
    padding:30px;
    background:white;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    color:#b91c1c;
}

/* =========================
   PDF RENDER AREA
========================= */

#printArea{
    position:fixed;
    left:-20000px;
    top:0;
    width:190mm;
    background:white;
    z-index:-9999;
    pointer-events:none;
}

/*
   PDF version of card.
   Exactly two cards will be rendered
   separately on every A4 page.
*/

.pdf-card{
    width:190mm !important;
    height:138mm !important;
    min-height:138mm !important;
    margin:0 !important;
    padding:7mm !important;
    border-radius:4px !important;
    box-shadow:none !important;
    overflow:hidden !important;
    background:
        linear-gradient(
            135deg,
            rgba(239,246,255,1),
            rgba(255,255,255,1),
            rgba(240,253,244,1)
        ) !important;
}

.pdf-card .bottom-section{
    min-height:31mm;
}

.pdf-card .signature-image{
    mix-blend-mode:normal !important;
}

.pdf-card .school-seal{
    mix-blend-mode:normal !important;
}

/* =========================
   PRINT
========================= */

@media print{

    @page{
        size:A4 portrait;
        margin:5mm;
    }

    body{
        background:white;
        padding:0;
        margin:0;
    }

    .controls{
        display:none !important;
    }

    #result{
        width:100%;
    }

    .admit-card{
        width:190mm;
        height:138mm;
        min-height:138mm;
        margin:0 auto 5mm;
        box-shadow:none;
        border-radius:4px;
        page-break-inside:avoid;
        break-inside:avoid;
    }

    .admit-card:nth-child(2n){
        page-break-after:always;
        break-after:page;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{
        padding:10px;
    }

    .admit-card{
        width:100%;
        min-height:auto;
        padding:15px;
    }

    .card-main{
        grid-template-columns:1fr 90px;
        gap:10px;
    }

    .school-title h1{
        font-size:16px;
    }

    .school-title h2{
        font-size:12px;
    }

    .detail-row{
        grid-template-columns:95px 8px 1fr;
        font-size:10px;
    }

}

function getPhotoPath(roll){

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* =========================================================
   SEARCH STUDENT
========================================================= */

function findStudent(){

    const input =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const result =
        document.getElementById("result");

    const status =
        document.getElementById("status");


    if(!input){

        result.innerHTML = "";

        status.textContent =
            "Please enter Roll Number or Student Name.";

        status.style.color =
            "#b45309";

        return;

    }


    let foundRoll = null;


    for(const roll in students){

        const student =
            students[roll];

        if(
            roll.toLowerCase() === input ||
            student.name.toLowerCase().includes(input)
        ){

            foundRoll = roll;

            break;

        }

    }


    if(foundRoll){

        result.innerHTML =
            createCard(
                foundRoll,
                students[foundRoll]
            );

        status.textContent =
            "Admit Card Found ✓";

        status.style.color =
            "#15803d";

    }

    else{

        result.innerHTML = `

            <div class="not-found">

                <h2>
                    Admit Card Not Found
                </h2>

                <p>
                    Please check the Roll Number or Student Name.
                </p>

            </div>

        `;

        status.textContent =
            "";

    }

}

document

.addEventListener("keydown",function(event){

    if(event.key === "Enter"){

/* =========================================================
   IMAGE LOADER WITH TIMEOUT
========================================================= */

function waitForImage(img,timeout=5000){

    return new Promise(resolve => {

        if(
            img.complete &&
            img.naturalWidth > 0
        ){

            resolve(true);

            return;

        }


        let finished = false;


        const finish = (success) => {

            if(finished) return;

            finished = true;

            clearTimeout(timer);

            img.onload = null;
            img.onerror = null;

            resolve(success);

        };


        const timer =
            setTimeout(
                () => finish(false),
                timeout
            );


        img.onload =
            () => finish(true);

        img.onerror =
            () => finish(false);

    });

}


/* =========================================================
   WAIT FOR ALL IMAGES
========================================================= */

async function waitForImages(container){

    const images =
        Array.from(
            container.querySelectorAll("img")
        );


    for(const img of images){

        await waitForImage(
            img,
            5000
        );

    }

}


/* =========================================================
   WAIT
========================================================= */

function delay(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}


/* =========================================================
   DOWNLOAD ALL CLASS PDF
========================================================= */

async function downloadAllClassPDF(){

    const button =
        document.getElementById(
            "downloadAllBtn"
        );

    const status =
        document.getElementById(
            "status"
        );

    const printArea =
        document.getElementById(
            "printArea"
        );


    if(
        typeof html2canvas === "undefined" ||
        typeof window.jspdf === "undefined"
    ){

        alert(
            "PDF library load nahi hui. Internet connection check karein."
        );

        return;

    }


    /* Prevent double click */

    button.disabled = true;

    button.style.opacity = "0.6";

    button.textContent =
        "Preparing PDF...";


    status.textContent =
        "Please wait... PDF is being prepared.";

    status.style.color =
        "#1d4ed8";


    try{

        /* =========================================
           CREATE PDF
        ========================================= */

        const {
            jsPDF
        } = window.jspdf;


        const pdf =
            new jsPDF({

                orientation:"portrait",

                unit:"mm",

                format:"a4",

                compress:true

            });


        const rollNumbers =
            Object.keys(students);


        const cardWidth = 190;

        const cardHeight = 138;

        const left = 10;

        const topPositions = [
            5,
            151
        ];


        /* =========================================
           RENDER EACH CARD
        ========================================= */

        for(
            let i=0;
            i<rollNumbers.length;
            i++
        ){

            const roll =
                rollNumbers[i];

            const student =
                students[roll];


            status.textContent =
                `Preparing Admit Card ${i+1} of ${rollNumbers.length}...`;


            /*
               Clear previous card
            */

            printArea.innerHTML =
                createCard(
                    roll,
                    student
                );


            const card =
                printArea.querySelector(
                    ".admit-card"
                );


            /*
               PDF class
            */

            card.classList.add(
                "pdf-card"
            );


            /*
               Temporarily make render area visible.
               This is much more reliable for
               html2canvas than display:none.
            */

            printArea.style.position =
                "fixed";

            printArea.style.left =
                "0px";

            printArea.style.top =
                "0px";

            printArea.style.width =
                "190mm";

            printArea.style.height =
                "138mm";

            printArea.style.zIndex =
                "999999";

            printArea.style.opacity =
                "1";

            printArea.style.background =
                "white";

            printArea.style.pointerEvents =
                "none";


            /*
               Wait for browser layout
            */

            await delay(150);


            /*
               Wait for logo, student photo,
               seal and signatures
            */

            await waitForImages(
                card
            );


            /*
               Give browser time to paint images
            */

            await delay(250);


            /*
               Capture card
            */

            const canvas =
                await html2canvas(
                    card,
                    {

                        scale:2,

                        useCORS:true,

                        allowTaint:false,

                        backgroundColor:null,

                        imageTimeout:5000,

                        logging:false,

                        foreignObjectRendering:false,

                        scrollX:0,

                        scrollY:0,

                        width:card.offsetWidth,

                        height:card.offsetHeight

                    }
                );


            const image =
                canvas.toDataURL(
                    "image/jpeg",
                    0.95
                );


            /*
               Every two cards = one A4 page
            */

            const position =
                i % 2;


            if(i > 0 && position === 0){

                pdf.addPage();

            }


            pdf.addImage(

                image,

                "JPEG",

                left,

                topPositions[position],

                cardWidth,

                cardHeight,

                undefined,

                "FAST"

            );


            /*
               Free canvas memory
            */

            canvas.width = 1;
            canvas.height = 1;

        }


        /* =========================================
           CLEANUP
        ========================================= */

        printArea.innerHTML = "";

        printArea.style.position = "fixed";

        printArea.style.left = "-20000px";

        printArea.style.top = "0";

        printArea.style.width = "0";

        printArea.style.height = "0";

        printArea.style.zIndex = "-9999";

        printArea.style.opacity = "0";

        printArea.style.background = "transparent";


        /* =========================================
           SAVE
        ========================================= */

        status.textContent =
            "Finalizing PDF...";


        await delay(300);


        pdf.save(
            "Class-7-Admit-Cards-2026-27.pdf"
        );


        status.textContent =
            "PDF downloaded successfully ✓";

        status.style.color =
            "#15803d";


    }

    catch(error){

        console.error(
            "PDF ERROR:",
            error
        );


        /*
           Cleanup even after error
        */

        printArea.innerHTML = "";

        printArea.style.position = "fixed";

        printArea.style.left = "-20000px";

        printArea.style.top = "0";

        printArea.style.width = "0";

        printArea.style.height = "0";

        printArea.style.zIndex = "-9999";

        printArea.style.opacity = "0";


        status.textContent =
            "PDF banate waqt error aaya. Browser Console check karein.";

        status.style.color =
            "#b91c1c";


        alert(
            "PDF generate nahi ho saka.\n\n" +
            "Please page ko refresh karke dobara try karein."
        );

    }

    finally{

        button.disabled =
            false;

        button.style.opacity =
            "1";

        button.textContent =
            "Download All Class Admit Cards";

    }

}


/* =========================================================
   INITIAL MESSAGE
========================================================= */

document
.getElementById("status")
.textContent =
"Enter Roll Number or Student Name to search.";

document
.getElementById("status")
.style.color =
"#374151";

</script>
