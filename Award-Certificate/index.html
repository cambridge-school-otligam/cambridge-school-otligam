<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students Award Certificate - Cambridge School</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eaf1fa;
    font-family:Arial,sans-serif;
    color:#092653;
}

/* HEADER */

.header{
    text-align:center;
    background:linear-gradient(135deg,#071b49,#15518e);
    color:white;
    padding:20px;
    border-radius:12px;
    border-bottom:5px solid #d5a83e;
}

.header h1{
    font-family:Georgia,serif;
    font-size:30px;
    margin:5px;
}

.header h2{
    color:#ffdc81;
    margin:5px;
}

/* SEARCH */

.search-box{
    max-width:750px;
    margin:25px auto;
    padding:25px;
    background:white;
    border-radius:12px;
    box-shadow:0 4px 15px #0002;
    text-align:center;
}

.search-box input{
    width:70%;
    padding:14px;
    border:2px solid #c49a35;
    border-radius:7px;
    font-size:16px;
}

button{
    padding:13px 25px;
    background:#092653;
    color:white;
    border:none;
    border-radius:7px;
    cursor:pointer;
    font-size:16px;
    margin:8px;
}

button:hover{
    background:#b8860b;
}

#message{
    font-weight:bold;
    color:#a00020;
}

/* CERTIFICATE */

#certificateArea{
    margin-top:25px;
}

.certificate{
    width:100%;
    max-width:1200px;
    aspect-ratio:297 / 210;
    margin:20px auto;
    padding:10px;
    position:relative;
    overflow:hidden;
    background:#fffdf5;
    border:7px double #c49a35;
    outline:2px solid #092653;
    outline-offset:-15px;
    box-shadow:0 8px 25px #0002;
}

/* OUTER GOLDEN CURVE */

.certificate:before{
    content:"";
    position:absolute;
    inset:12px;
    border:3px solid #d3a33a;
    border-radius:85px;
    pointer-events:none;
}

/* INNER FRAME */

.certificate-inner{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    border:2px solid #173b72;
    border-radius:75px;
    padding:8px 65px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;

    background:
    radial-gradient(ellipse at center,#ffffff 0%,#fffdf6 75%,#f8edcf 100%);
}

/* SIMPLE BLUE AND GOLD CORNER CURVES */

.corner-decoration{
    position:absolute;
    width:150px;
    height:100px;
    z-index:2;
    pointer-events:none;
}

.corner-decoration svg{
    width:100%;
    height:100%;
}

.top-left{
    top:0;
    left:0;
}

.top-right{
    top:0;
    right:0;
    transform:scaleX(-1);
}

.bottom-left{
    bottom:0;
    left:0;
    transform:scaleY(-1);
}

.bottom-right{
    bottom:0;
    right:0;
    transform:scale(-1);
}

/* SIDE CURVED BORDER ACCENTS */

.side-accent{
    position:absolute;
    top:22%;
    height:56%;
    width:24px;
    z-index:2;
    pointer-events:none;
}

.side-left{
    left:8px;
    border-left:3px solid #d0a13c;
    border-radius:50%;
}

.side-right{
    right:8px;
    border-right:3px solid #d0a13c;
    border-radius:50%;
}

/* HALF CIRCLE SCHOOL NAME */

.school-top{
    width:100%;
    height:95px;
    flex-shrink:0;
    position:relative;
    z-index:4;
    margin-top:-3px;
}

.school-top svg{
    width:100%;
    height:100%;
    overflow:visible;
}

.curved-name{
    font-family:Georgia,serif;
    font-size:30px;
    font-weight:bold;
    fill:#102c63;
    letter-spacing:1.2px;
}

/* SCHOOL LOGO */

.logo{
    width:73px;
    height:73px;
    object-fit:contain;
    z-index:4;
    margin-top:-15px;
}

/* ADDRESS */

.address{
    font-family:Georgia,serif;
    font-size:16px;
    font-weight:bold;
    letter-spacing:3px;
    color:#9b701e;
    z-index:4;
    margin-top:-5px;
}

/* GOLDEN LINE */

.gold-line{
    width:65%;
    height:3px;
    flex-shrink:0;
    background:linear-gradient(
        to right,
        transparent,
        #b78625,
        #f4d77e,
        #b78625,
        transparent
    );
    margin:2px;
    z-index:4;
}

/* MAIN HEADING */

.heading{
    font-family:Georgia,serif;
    font-size:34px;
    font-weight:bold;
    text-align:center;
    color:#092653;
    letter-spacing:1.5px;
    padding:5px 25px;
    margin:2px;
    border:3px double #c49a35;
    border-radius:30px;
    background:linear-gradient(90deg,#f7df9c,#fff5d6,#f7df9c);
    text-shadow:1px 1px 1px #d5b46c;
    z-index:4;
}

/* AWARD RIBBON */

.award-title{
    position:relative;
    background:linear-gradient(
        90deg,
        #061b49,
        #1554a0,
        #061b49
    );
    color:#fff1bd;
    font-family:Georgia,serif;
    font-size:23px;
    font-weight:bold;
    font-style:italic;
    padding:9px 65px;
    margin:3px;
    border-top:3px solid #eac45e;
    border-bottom:3px solid #eac45e;
    box-shadow:0 4px 8px #0003;
    z-index:4;
}

.award-title:before,
.award-title:after{
    content:"★";
    position:absolute;
    top:7px;
    color:#ffd45d;
    font-size:21px;
}

.award-title:before{
    left:20px;
}

.award-title:after{
    right:20px;
}

/* PRESENTED TEXT */

.presented{
    font-family:Georgia,serif;
    font-size:17px;
    font-style:italic;
    color:#263b61;
    margin:2px;
    z-index:4;
}

/* STUDENT SECTION */

.student-section{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    margin:3px 0;
    z-index:4;
}

.student-photo-box{
    width:125px;
    height:150px;
    padding:5px;
    flex-shrink:0;
    border:5px double #c49a35;
    outline:2px solid #153969;
    background:white;
    box-shadow:0 3px 10px #0002;
}

.student-photo{
    width:100%;
    height:100%;
    object-fit:cover;
}

.student-details{
    flex:1;
    text-align:center;
}

.student-name{
    font-family:Georgia,serif;
    font-size:35px;
    font-weight:bold;
    color:#092653;
    border-bottom:2px solid #c49a35;
    padding:5px 12px;
    margin:4px;
}

.class-text{
    display:inline-block;
    font-family:Georgia,serif;
    font-size:20px;
    font-weight:bold;
    color:#092653;
    border:2px solid #c49a35;
    border-radius:25px;
    padding:4px 30px;
    margin:5px;
}

.description{
    font-family:Georgia,serif;
    font-style:italic;
    font-size:16px;
    line-height:1.4;
    max-width:720px;
    margin:5px auto;
    color:#283b60;
}

/* DATE */

.date-text{
    font-family:Georgia,serif;
    font-size:17px;
    font-weight:bold;
    color:#8d6419;
    padding:5px 25px;
    border:2px solid #c49a35;
    border-radius:25px;
    background:#fff3d0;
    margin:3px;
    z-index:4;
}

/* FOOTER */

.footer{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin:2px;
    padding:0 10px;
    z-index:4;
}

.signature-box{
    width:180px;
    text-align:center;
    font-weight:bold;
    color:#092653;
    font-size:15px;
}

.principal-sign{
    width:125px;
    height:43px;
    object-fit:contain;
    display:block;
    margin:0 auto 3px;
}

.signature-line{
    border-top:2px solid #092653;
    padding-top:5px;
}

.seal{
    width:85px;
    height:85px;
    object-fit:contain;
}

/* MOBILE */

@media screen and (max-width:700px){

    .certificate{
        aspect-ratio:auto;
        min-height:700px;
    }

    .certificate-inner{
        padding:12px 25px;
        border-radius:35px;
    }

    .school-top{
        height:80px;
    }

    .curved-name{
        font-size:19px;
    }

    .logo{
        width:65px;
        height:65px;
    }

    .heading{
        font-size:23px;
    }

    .award-title{
        font-size:18px;
        padding:8px 35px;
    }

    .student-section{
        flex-direction:column;
    }

    .student-name{
        font-size:25px;
    }

    .footer{
        padding:0;
    }

    .signature-box{
        width:110px;
        font-size:12px;
    }

    .seal{
        width:60px;
        height:60px;
    }
}

/* A4 LANDSCAPE PRINT */

@media print{

    @page{
        size:A4 landscape;
        margin:0;
    }

    html,body{
        width:297mm!important;
        height:auto!important;
        margin:0!important;
        padding:0!important;
        background:white!important;
    }

    .no-print{
        display:none!important;
    }

    #certificateArea{
        width:297mm!important;
        margin:0!important;
        padding:0!important;
    }

    .certificate{
        width:297mm!important;
        height:210mm!important;
        min-height:210mm!important;
        max-height:210mm!important;
        max-width:none!important;
        aspect-ratio:auto!important;
        margin:0!important;
        padding:5mm!important;

        border:3mm double #c49a35!important;
        outline:1px solid #092653!important;
        outline-offset:-4mm!important;

        overflow:hidden!important;
        box-sizing:border-box!important;

        page-break-after:always;
        break-after:page;

        -webkit-print-color-adjust:exact!important;
        print-color-adjust:exact!important;
    }

    .certificate:last-child{
        page-break-after:auto;
        break-after:auto;
    }

    .certificate-inner{
        width:100%;
        height:100%!important;
        min-height:0!important;
        padding:2mm 12mm!important;
        border-radius:18mm!important;
        justify-content:space-between!important;
        overflow:hidden!important;
    }

    .certificate:before{
        inset:3mm!important;
        border-radius:20mm!important;
    }

    .corner-decoration{
        width:35mm!important;
        height:24mm!important;
    }

    .side-accent{
        top:22%!important;
        height:56%!important;
    }

    .school-top{
        height:27mm!important;
        flex-shrink:0;
    }

    .curved-name{
        font-size:29px!important;
    }

    .logo{
        width:17mm!important;
        height:17mm!important;
        margin-top:-4mm!important;
    }

    .address{
        font-size:14px!important;
        margin-top:-2mm!important;
    }

    .gold-line{
        margin:1px!important;
    }

    .heading{
        font-size:27px!important;
        padding:3px 20px!important;
        margin:1px!important;
    }

    .award-title{
        font-size:19px!important;
        padding:5px 45px!important;
        margin:1px!important;
    }

    .presented{
        font-size:14px!important;
        margin:1px!important;
    }

    .student-section{
        gap:18px!important;
        margin:1px 0!important;
    }

    .student-photo-box{
        width:30mm!important;
        height:36mm!important;
        padding:2px!important;
    }

    .student-name{
        font-size:26px!important;
        padding:3px!important;
        margin:2px!important;
    }

    .class-text{
        font-size:16px!important;
        padding:3px 22px!important;
        margin:2px!important;
    }

    .description{
        font-size:13px!important;
        line-height:1.3!important;
        margin:2px auto!important;
    }

    .date-text{
        font-size:14px!important;
        padding:3px 20px!important;
        margin:1px!important;
    }

    .footer{
        margin:1px!important;
        padding:0 10px!important;
    }

    .signature-box{
        width:170px!important;
        font-size:13px!important;
    }

    .principal-sign{
        width:110px!important;
        height:35px!important;
    }

    .seal{
        width:20mm!important;
        height:20mm!important;
    }

    *{
        -webkit-print-color-adjust:exact!important;
        print-color-adjust:exact!important;
    }
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header no-print">

    <h1>CAMBRIDGE SCHOOL</h1>
    <h2>OF MODERN EDUCATION</h2>
    <h3>OTLIGAM, BEERWAH</h3>
    <h2>STUDENTS AWARD CERTIFICATE</h2>

</div>

<!-- SEARCH BOX -->

<div class="search-box no-print">

    <h2>🔍 Search Student Certificate</h2>

    <input
        type="text"
        id="searchName"
        placeholder="Enter Student Name..."
        onkeydown="if(event.key==='Enter') searchStudent()"
    >

    <button onclick="searchStudent()">Search</button>

    <button onclick="printCertificate()">
        Print / Save PDF
    </button>

    <p id="message">
        Enter student name to view certificate.
    </p>

</div>

<!-- CERTIFICATE AREA -->

<div id="certificateArea"></div>

<script>

/* STUDENT RECORDS */

const students = [

    {
        name:"Jannat Ul Firdous",
        className:"7th",
        award:"Discipline Award",
        date:"30-10-2026",

        photo:"../Admit-Cards/Annual-Examination-2026-27/Class-7/26CS70009.jpg",

        description:
        "In recognition of excellent discipline, good manners, responsible behaviour and respect for school values."
    },

    {
        name:"Suliam Jaan",
        className:"8th",
        award:"Sports Achievement",
        date:"30-10-2026",

        photo:"",

        description:
        "In recognition of outstanding sports achievement, teamwork, dedication and excellent sporting spirit."
    }

];


/* SIMPLE BLUE AND GOLD CORNER DESIGN */

const cornerSVG = `

<svg viewBox="0 0 160 110"
xmlns="http://www.w3.org/2000/svg">

    <path
        d="M2 105 Q5 8 155 3"
        fill="none"
        stroke="#c49a35"
        stroke-width="5"
    />

    <path
        d="M2 90 Q10 18 140 12"
        fill="none"
        stroke="#092653"
        stroke-width="8"
    />

    <path
        d="M8 75 Q18 28 125 22"
        fill="none"
        stroke="#e4bd62"
        stroke-width="2"
    />

    <path
        d="M15 12 Q40 5 60 22
        M12 24 Q35 15 48 30"
        fill="none"
        stroke="#c49a35"
        stroke-width="2"
    />

    <circle cx="18" cy="17" r="5" fill="#d4a638"/>
    <circle cx="35" cy="12" r="3" fill="#153c76"/>

</svg>

`;


/* CREATE CERTIFICATE */

function createCertificate(student){

    const photoHTML = student.photo
    ? `
        <div class="student-photo-box">
            <img
                src="${escapeHTML(student.photo)}"
                class="student-photo"
                alt="Student Photo"
                onerror="this.parentElement.style.display='none'"
            >
        </div>
    `
    : "";


    return `

    <div class="certificate">

        <div class="certificate-inner">

            <!-- FOUR CORNER DESIGNS -->

            <div class="corner-decoration top-left">
                ${cornerSVG}
            </div>

            <div class="corner-decoration top-right">
                ${cornerSVG}
            </div>

            <div class="corner-decoration bottom-left">
                ${cornerSVG}
            </div>

            <div class="corner-decoration bottom-right">
                ${cornerSVG}
            </div>

            <!-- SIMPLE SIDE ACCENTS -->

            <div class="side-accent side-left"></div>
            <div class="side-accent side-right"></div>

            <!-- HALF CIRCLE SCHOOL NAME -->

            <div class="school-top">

                <svg viewBox="0 0 1000 130"
                     xmlns="http://www.w3.org/2000/svg">

                    <defs>
                        <path
                            id="schoolArc"
                            d="M 100 120 Q 500 -40 900 120"
                        />
                    </defs>

                    <text class="curved-name"
                          text-anchor="middle">

                        <textPath
                            href="#schoolArc"
                            startOffset="50%">

                            CAMBRIDGE SCHOOL OF MODERN EDUCATION

                        </textPath>

                    </text>

                </svg>

            </div>

            <!-- SCHOOL LOGO -->

            <img
                src="../logo.png"
                class="logo"
                alt="School Logo"
            >

            <!-- SCHOOL ADDRESS -->

            <div class="address">
                OTLIGAM, BEERWAH
            </div>

            <div class="gold-line"></div>

            <!-- MAIN HEADING -->

            <div class="heading">
                CERTIFICATE OF ACHIEVEMENT
            </div>

            <!-- AWARD RIBBON -->

            <div class="award-title">
                ${escapeHTML(student.award)}
            </div>

            <div class="presented">
                This certificate is proudly presented to
            </div>

            <!-- STUDENT DETAILS -->

            <div class="student-section">

                ${photoHTML}

                <div class="student-details">

                    <div class="student-name">
                        ${escapeHTML(student.name)}
                    </div>

                    <div class="class-text">
                        Class: ${escapeHTML(student.className)}
                    </div>

                    <div class="description">
                        ${escapeHTML(student.description)}
                    </div>

                </div>

            </div>

            <!-- DATE -->

            <div class="date-text">
                Date: ${escapeHTML(student.date)}
            </div>

            <!-- FOOTER -->

            <div class="footer">

                <div class="signature-box">

                    <div class="signature-line">
                        Exam Incharge
                    </div>

                </div>

                <img
                    src="../school-seal.png"
                    class="seal"
                    alt="School Seal"
                >

                <div class="signature-box">

                    <img
                        src="../principal-sign.png"
                        class="principal-sign"
                        alt="Principal Signature"
                    >

                    <div class="signature-line">
                        Principal
                    </div>

                </div>

            </div>

        </div>

    </div>

    `;

}


/* SEARCH STUDENT */

function searchStudent(){

    const search = document
        .getElementById("searchName")
        .value
        .trim()
        .toLowerCase();

    const area = document.getElementById("certificateArea");

    const message = document.getElementById("message");

    area.innerHTML = "";

    if(search === ""){

        message.innerText = "Please enter student name.";

        return;
    }

    const found = students.filter(student =>
        student.name.toLowerCase().includes(search)
    );

    if(found.length === 0){

        message.innerText =
        "No student found. Please check the name.";

        return;
    }

    message.innerText =
    found.length + " certificate(s) found.";

    area.innerHTML = found.map(createCertificate).join("");

    window.scrollTo({
        top:area.offsetTop,
        behavior:"smooth"
    });

}


/* PRINT / SAVE PDF */

async function printCertificate(){

    const area = document.getElementById("certificateArea");

    if(!area.innerHTML.trim()){

        alert("Please search a student first.");

        return;
    }

    const images = Array.from(area.querySelectorAll("img"));

    await Promise.all(images.map(img => {

        if(img.complete){
            return Promise.resolve();
        }

        return new Promise(resolve => {

            img.onload = resolve;
            img.onerror = resolve;

            setTimeout(resolve,5000);

        });

    }));

    window.print();

}


/* HTML SECURITY */

function escapeHTML(value){

    return String(value).replace(/[&<>"']/g,char => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

    }[char]));

}

</script>

</body>
</html>
