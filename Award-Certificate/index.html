<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students Award Certificate - Cambridge School</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eaf1fa;
    font-family: Arial, sans-serif;
    color: #002060;
}

/* ================= HEADER ================= */

.header {
    text-align: center;
    background: linear-gradient(135deg,#001b50,#0759a5);
    color: white;
    padding: 20px;
    border-radius: 12px;
    border-bottom: 5px solid #d4a52c;
}

.header h1 {
    font-family: Georgia,serif;
    font-size: 30px;
    margin: 5px;
}

.header h2 {
    color: #ffd76a;
    margin: 5px;
}

/* ================= SEARCH ================= */

.search-box {
    max-width: 750px;
    margin: 25px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0002;
    text-align: center;
}

.search-box input {
    width: 70%;
    padding: 14px;
    border: 2px solid #c49a35;
    border-radius: 7px;
    font-size: 16px;
}

button {
    padding: 13px 25px;
    background: #002060;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
    margin: 8px;
}

button:hover {
    background: #b8860b;
}

#message {
    font-weight: bold;
    color: #b00020;
}

/* ================= CERTIFICATE ================= */

#certificateArea {
    margin-top: 25px;
}

.certificate {

    width: 100%;
    max-width: 1200px;
    min-height: 680px;

    margin: 20px auto;
    padding: 10px;

    position: relative;
    overflow: hidden;

    background: #fffdf2;

    border: 9px solid #002060;
    outline: 3px solid #d9a52e;
    outline-offset: -15px;

    box-shadow: 0 5px 20px #0003;

}

/* INNER BORDER */

.certificate-inner {

    position: relative;

    width: 100%;
    min-height: 650px;

    border: 3px solid #c49a35;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;

    padding: 12px 75px 15px;

    background:
        radial-gradient(ellipse at center,
        #fffef8 0%,
        #fffdf1 65%,
        #fff5d9 100%);

}

/* ================= SUNBURST BACKGROUND ================= */

.sunburst {

    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    opacity: .12;

    pointer-events: none;

    z-index: 0;

}

/* ================= GOLDEN CORNERS ================= */

.corner {

    position: absolute;

    width: 125px;
    height: 125px;

    z-index: 5;

    pointer-events: none;

}

.corner svg {
    width: 100%;
    height: 100%;
}

.top-left {
    top: 0;
    left: 0;
}

.top-right {
    top: 0;
    right: 0;
    transform: scaleX(-1);
}

.bottom-left {
    bottom: 0;
    left: 0;
    transform: scaleY(-1);
}

.bottom-right {
    bottom: 0;
    right: 0;
    transform: scale(-1);
}

/* ================= SIDE LEAVES ================= */

.side-decoration {

    position: absolute;

    top: 25%;
    height: 55%;

    width: 65px;

    z-index: 2;

    pointer-events: none;

}

.side-decoration svg {
    width: 100%;
    height: 100%;
}

.side-left {
    left: 5px;
}

.side-right {
    right: 5px;
    transform: scaleX(-1);
}

/* ================= BOTTOM WAVES ================= */

.bottom-wave {

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 75px;

    z-index: 1;

    pointer-events: none;

}

/* ================= CONTENT ================= */

.content {
    position: relative;
    z-index: 4;
    width: 100%;
    text-align: center;
}

/* SCHOOL LOGO */

.logo {

    width: 78px;
    height: 78px;

    object-fit: contain;

    margin: 0 auto 2px;

}

/* SCHOOL NAME */

.school-name {

    font-family: Georgia,serif;

    font-size: 30px;

    font-weight: bold;

    color: #002060;

    margin: 2px;

    letter-spacing: .5px;

}

.address {

    font-family: Georgia,serif;

    font-size: 18px;

    font-weight: bold;

    color: #a57919;

    margin: 3px;

}

.address-line {

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 15px;

}

.address-line::before,
.address-line::after {

    content: "";

    width: 100px;
    height: 2px;

    background: linear-gradient(
        to right,
        transparent,
        #c49a35
    );

}

.address-line::after {

    transform: rotate(180deg);

}

/* ================= MAIN HEADING ================= */

.heading {

    font-family: Georgia,serif;

    font-size: 39px;

    font-weight: bold;

    color: #bd8616;

    margin: 8px 0;

    text-shadow: 1px 2px 1px #ead49b;

    letter-spacing: 1px;

}

/* ================= AWARD RIBBON ================= */

.ribbon {

    position: relative;

    display: inline-block;

    min-width: 470px;

    padding: 9px 55px;

    margin: 4px 0 7px;

    background: linear-gradient(
        90deg,
        #00133f,
        #0757a4,
        #00133f
    );

    border-top: 4px solid #e6bc4d;
    border-bottom: 4px solid #e6bc4d;

    color: white;

    font-family: Georgia,serif;

    font-size: 25px;

    font-style: italic;

    font-weight: bold;

    box-shadow: 0 4px 8px #0004;

}

.ribbon::before,
.ribbon::after {

    content: "";

    position: absolute;

    top: 5px;

    width: 0;
    height: 0;

    border-top: 28px solid #00245a;
    border-bottom: 28px solid #00245a;

}

.ribbon::before {

    left: -35px;

    border-left: 35px solid transparent;

}

.ribbon::after {

    right: -35px;

    border-right: 35px solid transparent;

}

.ribbon-star {

    color: #ffd04e;

    font-size: 22px;

    margin: 0 15px;

}

/* ================= PRESENTED ================= */

.presented {

    font-family: Georgia,serif;

    font-size: 19px;

    font-style: italic;

    color: #002060;

    margin: 4px;

}

/* ================= STUDENT DETAILS ================= */

.student-section {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    gap: 30px;

    margin: 4px 0;

}

/* PHOTO FRAME */

.student-photo-box {

    width: 145px;
    height: 175px;

    padding: 5px;

    flex-shrink: 0;

    background: white;

    border: 5px double #c49a35;

    outline: 2px solid #002060;

    border-radius: 12px;

    box-shadow: 0 4px 10px #0003;

}

.student-photo {

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 5px;

}

/* STUDENT INFORMATION */

.student-details {

    flex: 1;

    text-align: center;

}

.student-name {

    font-family: Georgia,serif;

    font-size: 39px;

    font-weight: bold;

    color: #002060;

    border-bottom: 3px solid #c49a35;

    padding: 4px 10px;

    margin: 3px;

}

.class-text {

    font-family: Georgia,serif;

    font-size: 23px;

    font-weight: bold;

    color: #002060;

    margin: 5px;

}

.description {

    font-family: Georgia,serif;

    font-style: italic;

    font-size: 18px;

    line-height: 1.4;

    max-width: 750px;

    margin: 6px auto;

    color: #001747;

}

/* ================= DATE ================= */

.date-text {

    display: inline-block;

    font-family: Georgia,serif;

    font-size: 19px;

    font-weight: bold;

    color: #002060;

    background: #fff8e4;

    border: 3px double #c49a35;

    border-radius: 30px;

    padding: 5px 35px;

    margin: 4px;

}

/* ================= FOOTER ================= */

.footer {

    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: end;

    padding: 0 10px;

    margin-top: 3px;

}

.signature-box {

    width: 210px;

    text-align: center;

    font-family: Georgia,serif;

    font-size: 17px;

    font-weight: bold;

    color: #002060;

}

.principal-sign {

    width: 140px;

    height: 55px;

    object-fit: contain;

    display: block;

    margin: 0 auto 3px;

}

.signature-line {

    border-top: 2px solid #002060;

    padding-top: 6px;

}

.seal {

    width: 105px;

    height: 105px;

    object-fit: contain;

    z-index: 5;

}

/* ================= SVG DECORATION ================= */

@media screen and (max-width:700px) {

    .student-section {
        flex-direction: column;
    }

    .school-name {
        font-size: 22px;
    }

    .heading {
        font-size: 25px;
    }

    .student-name {
        font-size: 27px;
    }

    .ribbon {
        min-width: 220px;
        font-size: 18px;
    }

    .certificate-inner {
        padding: 15px;
    }

    .corner {
        width: 65px;
        height: 65px;
    }

    .side-decoration {
        width: 30px;
    }

    .footer {
        padding: 0;
    }

}

/* ================= A4 LANDSCAPE PRINT ================= */

@media print {

    @page {
        size: A4 landscape;
        margin: 0;
    }

    html,
    body {

        width: 297mm !important;

        margin: 0 !important;
        padding: 0 !important;

        background: white !important;

    }

    .no-print {
        display: none !important;
    }

    #certificateArea {

        width: 297mm !important;

        margin: 0 !important;
        padding: 0 !important;

    }

    .certificate {

        width: 297mm !important;
        height: 210mm !important;

        min-height: 210mm !important;
        max-height: 210mm !important;

        margin: 0 !important;

        padding: 4mm !important;

        border: 3mm solid #002060 !important;

        outline: 1mm solid #c49a35 !important;

        overflow: hidden !important;

        box-shadow: none !important;

        page-break-after: always;
        break-after: page;

        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;

    }

    .certificate:last-child {

        page-break-after: auto;
        break-after: auto;

    }

    .certificate-inner {

        width: 100%;

        height: 100% !important;
        min-height: 0 !important;

        padding: 2mm 17mm 14mm !important;

        justify-content: space-between !important;

        overflow: hidden !important;

    }

    .corner {

        width: 30mm !important;
        height: 30mm !important;

    }

    .side-decoration {

        width: 17mm !important;
        height: 58% !important;

        top: 23% !important;

    }

    .bottom-wave {

        height: 20mm !important;

    }

    .logo {

        width: 17mm !important;
        height: 17mm !important;

    }

    .school-name {

        font-size: 23px !important;
        margin: 1px !important;

    }

    .address {

        font-size: 15px !important;
        margin: 1px !important;

    }

    .heading {

        font-size: 30px !important;
        margin: 3px !important;

    }

    .ribbon {

        min-width: 115mm !important;

        font-size: 20px !important;

        padding: 5px 30px !important;

        margin: 2px !important;

    }

    .ribbon::before,
    .ribbon::after {

        border-top-width: 20px;
        border-bottom-width: 20px;

    }

    .presented {

        font-size: 15px !important;
        margin: 2px !important;

    }

    .student-section {

        gap: 8mm !important;
        margin: 2px 0 !important;

    }

    .student-photo-box {

        width: 32mm !important;
        height: 39mm !important;

        padding: 2px !important;

    }

    .student-name {

        font-size: 28px !important;

        padding: 3px !important;

        margin: 2px !important;

    }

    .class-text {

        font-size: 17px !important;
        margin: 2px !important;

    }

    .description {

        font-size: 14px !important;
        line-height: 1.3 !important;

        margin: 2px auto !important;

    }

    .date-text {

        font-size: 15px !important;

        padding: 3px 25px !important;

        margin: 2px !important;

    }

    .footer {

        padding: 0 8px !important;
        margin-top: 1px !important;

    }

    .signature-box {

        width: 180px !important;
        font-size: 14px !important;

    }

    .principal-sign {

        width: 110px !important;
        height: 35px !important;

    }

    .seal {

        width: 75px !important;
        height: 75px !important;

    }

    * {

        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;

    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header no-print">

    <h1>CAMBRIDGE SCHOOL</h1>

    <h2>OF MODERN EDUCATION</h2>

    <h3>OTLIGAM, BEERWAH</h3>

    <h2>STUDENTS AWARD CERTIFICATE</h2>

</div>


<!-- SEARCH AREA -->

<div class="search-box no-print">

    <h2>🔍 Search Student Certificate</h2>

    <input
        type="text"
        id="searchName"
        placeholder="Enter Student Name..."
        onkeydown="if(event.key==='Enter') searchStudent()"
    >

    <button onclick="searchStudent()">
        Search
    </button>

    <button onclick="printCertificate()">
        Print / Save PDF
    </button>

    <p id="message">
        Enter student name to view certificate.
    </p>

</div>


<!-- CERTIFICATE AREA -->

<div id="certificateArea"></div>


<script>

/* ================= STUDENT RECORDS ================= */

const students = [

    {
        name: "Jannat Ul Firdous",

        className: "7th",

        award: "Discipline Award",

        date: "30-10-2026",

        photo: "../Admit-Cards/Annual-Examination-2026-27/Class-7/26CS70009.jpg",

        description:
        "In recognition of excellent discipline, good manners, responsible behaviour and respect for school values."

    },

    {
        name: "Suliam Jaan",

        className: "8th",

        award: "Sports Achievement",

        date: "30-10-2026",

        photo: "",

        description:
        "In recognition of outstanding sports achievement, teamwork, dedication and excellent sporting spirit."

    }

];


/* ================= GOLDEN FLORAL CORNER ================= */

const cornerSVG = `

<svg viewBox="0 0 150 150"
xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">

        <stop offset="0%" stop-color="#fff1a5"/>

        <stop offset="35%" stop-color="#e6b63c"/>

        <stop offset="65%" stop-color="#a56e0c"/>

        <stop offset="100%" stop-color="#f5d56d"/>

    </linearGradient>

</defs>

<g fill="none"
stroke="url(#gold)"
stroke-width="3"
stroke-linecap="round">

    <path d="M3 3 C65 0 70 35 80 75 C95 20 115 5 147 3"/>

    <path d="M3 3 C5 65 35 70 75 80 C20 95 5 115 3 147"/>

    <path d="M12 12 Q55 15 70 65 Q25 50 12 12Z"/>

    <path d="M12 12 Q15 55 65 70 Q50 25 12 12Z"/>

    <path d="M135 12 Q100 12 80 65 Q125 50 135 12Z"/>

    <path d="M12 135 Q12 100 65 80 Q50 125 12 135Z"/>

    <path d="M30 5 Q50 30 70 45"/>

    <path d="M5 30 Q30 50 45 70"/>

    <path d="M75 5 Q105 30 110 55"/>

    <path d="M5 75 Q30 105 55 110"/>

    <path d="M30 15 Q20 0 10 8 Q10 25 30 15Z"/>

    <path d="M15 30 Q0 20 8 10 Q25 10 15 30Z"/>

    <path d="M50 8 Q65 0 70 15 Q65 30 50 8Z"/>

    <path d="M8 50 Q0 65 15 70 Q30 65 8 50Z"/>

</g>

<g fill="url(#gold)" stroke="#a47716" stroke-width="1">

    <circle cx="75" cy="75" r="8"/>

    <circle cx="48" cy="22" r="4"/>

    <circle cx="22" cy="48" r="4"/>

    <circle cx="12" cy="75" r="3"/>

</g>

`;


/* ================= SIDE LEAVES ================= */

const sideSVG = `

<svg viewBox="0 0 70 300"
xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="leafGold" x1="0" y1="0" x2="1" y2="1">

        <stop offset="0%" stop-color="#fff0a0"/>

        <stop offset="50%" stop-color="#c18a20"/>

</defs>

<g fill="none"

    <path d="M35 125 Q65 100 65 88 Q38 95 35 125Z"/>

    <path d="M35 155 Q5 135 8 120 Q35 125 35 155Z"/>

    <path d="M35 185 Q65 160 65 148 Q38 155 35 185Z"/>

    <path d="M35 215 Q5 195 8 180 Q35 185 35 215Z"/>

    <path d="M35 245 Q65 220 65 208 Q38 215 35 245Z"/>

    <path d="M35 275 Q5 255 8 240 Q35 245 35 275Z"/>

</g>

<g fill="#e8b943" stroke="#a47716">

    <path d="M35 145 L43 158 L35 171 L27 158Z"/>

    <path d="M35 15 L40 24 L35 33 L30 24Z"/>

    <path d="M35 270 L40 279 L35 288 L30 279Z"/>

</g>

</svg>

`;


/* ================= BOTTOM WAVE ================= */

const bottomWave = `

<svg class="bottom-wave"
viewBox="0 0 1200 100"
preserveAspectRatio="none"
xmlns="http://www.w3.org/2000/svg">

<path
d="M0 50 Q150 100 300 65 Q500 25 600 65 Q800 100 950 65 Q1100 30 1200 60 L1200 100 L0 100Z"
fill="#001747"/>

<path
d="M0 65 Q150 110 300 75 Q500 40 600 75 Q800 110 950 75 Q1100 45 1200 70"
fill="none"
stroke="#e6b83f"
stroke-width="7"/>

<path
d="M0 83 Q150 120 300 90 Q500 55 600 90 Q800 120 950 90 Q1100 60 1200 85"
fill="none"
stroke="#f5d36c"
stroke-width="3"/>

</svg>

`;


/* ================= SUNBURST ================= */

const sunburst = `

<svg class="sunburst"
viewBox="0 0 1200 800"
preserveAspectRatio="none"
xmlns="http://www.w3.org/2000/svg">

<g stroke="#d6aa43" stroke-width="2">

${Array.from({length:40},(_,i)=>{

    const angle = (i*9)*Math.PI/180;

    const x1 = 600 + Math.cos(angle)*30;
    const y1 = 400 + Math.sin(angle)*30;

    const x2 = 600 + Math.cos(angle)*900;
    const y2 = 400 + Math.sin(angle)*900;

    return `<line x1="${x1}" y1="${y1}"
    x2="${x2}" y2="${y2}"/>`;

}).join("")}

</g>

</svg>

`;


/* ================= CREATE CERTIFICATE ================= */

function createCertificate(student) {

    const photoHTML = student.photo

    ? `

    <div class="student-photo-box">

        <img
            src="${escapeHTML(student.photo)}"
            class="student-photo"
            alt="Student Photo"
            onerror="this.parentElement.style.display='none'"
        >

    </div>

    `

    : "";


    return `

    <div class="certificate">

        <div class="certificate-inner">

            ${sunburst}

            <!-- CORNER DECORATIONS -->

            <div class="corner top-left">
                ${cornerSVG}
            </div>

            <div class="corner top-right">
                ${cornerSVG}
            </div>

            <div class="corner bottom-left">
                ${cornerSVG}
            </div>

            <div class="corner bottom-right">
                ${cornerSVG}
            </div>


            <!-- SIDE DECORATIONS -->

            <div class="side-decoration side-left">
                ${sideSVG}
            </div>

            <div class="side-decoration side-right">
                ${sideSVG}
            </div>


            <!-- TOP CONTENT -->

            <div class="content">

                <img
                    src="../logo.png"
                    class="logo"
                    alt="School Logo"
                >

                <div class="school-name">

                    CAMBRIDGE SCHOOL OF MODERN EDUCATION

                </div>

                <div class="address address-line">

                    OTLIGAM, BEERWAH

                </div>

                <div class="heading">

                    CERTIFICATE OF ACHIEVEMENT

                </div>

                <div class="ribbon">

                    <span class="ribbon-star">★</span>

                    ${escapeHTML(student.award)}

                    <span class="ribbon-star">★</span>

                </div>

                <div class="presented">

                    This certificate is proudly presented to

                </div>

            </div>


            <!-- STUDENT SECTION -->

            <div class="student-section">

                ${photoHTML}

                <div class="student-details">

                    <div class="student-name">

                        ${escapeHTML(student.name)}

                    </div>

                    <div class="class-text">

                        Class: ${escapeHTML(student.className)}

                    </div>

                    <div class="description">

                        ${escapeHTML(student.description)}

                    </div>

                </div>

            </div>


            <!-- DATE -->

            <div class="date-text">

                Date: ${escapeHTML(student.date)}

            </div>


            <!-- FOOTER -->

            <div class="footer">

                <div class="signature-box">

                    <div class="signature-line">

                        Exam Incharge

                    </div>

                </div>


                <img
                    src="../school-seal.png"
                    class="seal"
                    alt="School Seal"
                >


                <div class="signature-box">

                    <img
                        src="../principal-sign.png"
                        class="principal-sign"
                        alt="Principal Signature"
                    >

                    <div class="signature-line">

                        Principal

                    </div>

                </div>

            </div>


            <!-- BOTTOM WAVE -->

            ${bottomWave}

        </div>

    </div>

    `;

}


/* ================= SEARCH FUNCTION ================= */

function searchStudent() {

    const search = document
        .getElementById("searchName")
        .value.trim()
        .toLowerCase();

    const area = document.getElementById("certificateArea");

    const message = document.getElementById("message");

    area.innerHTML = "";


    if (search === "") {

        message.innerText = "Please enter student name.";

        return;

    }


    const found = students.filter(student =>

        student.name.toLowerCase().includes(search)

    );


    if (found.length === 0) {

        message.innerText =
        "No student found. Please check the name.";

        return;

    }


    message.innerText =
    found.length + " certificate(s) found.";


    area.innerHTML = found.map(createCertificate).join("");


    window.scrollTo({

        top: area.offsetTop,

        behavior: "smooth"

    });

}


/* ================= PRINT FUNCTION ================= */

async function printCertificate() {

    const area = document.getElementById("certificateArea");

    if (!area.innerHTML.trim()) {

        alert("Please search a student first.");

        return;

    }


    const images = Array.from(area.querySelectorAll("img"));

    await Promise.all(images.map(img => {

        if (img.complete) {

            return Promise.resolve();

        }

        return new Promise(resolve => {

            img.onload = resolve;

            img.onerror = resolve;

            setTimeout(resolve, 4000);

        });

    }));


    window.print();

}


/* ================= HTML SECURITY ================= */

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

    }[char]));

}
