<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students Award Certificate - Cambridge School</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eaf1fa;
    font-family: Arial, sans-serif;
    color: #002060;
}

/* HEADER */

.header {
    text-align: center;
    background: linear-gradient(135deg,#001b50,#0759a5);
    color: white;
    padding: 20px;
    border-radius: 12px;
    border-bottom: 5px solid #d4a52c;
}

.header h1 {
    font-family: Georgia,serif;
    font-size: 30px;
    margin: 5px;
}

.header h2 {
    color: #ffd76a;
    margin: 5px;
}

/* SEARCH BOX */

.search-box {
    max-width: 750px;
    margin: 25px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0002;
    text-align: center;
}

.search-box h2 {
    color: #002060;
}

.search-box input {
    width: 70%;
    padding: 14px;
    border: 2px solid #c49a35;
    border-radius: 7px;
    font-size: 16px;
}

button {
    padding: 13px 25px;
    background: #002060;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
    margin: 8px;
}

button:hover {
    background: #b8860b;
}

#message {
    font-weight: bold;
    color: #b00020;
}

/* CERTIFICATE */

#certificateArea {
    margin-top: 25px;
}

.certificate {
    width: 100%;
    max-width: 1200px;
    min-height: 650px;
    margin: 20px auto;
    padding: 12px;
    background: #fffdf3;
    border: 12px double #c49a35;
    outline: 3px solid #002060;
    outline-offset: -20px;
    text-align: center;
}

.certificate-inner {
    min-height: 600px;
    padding: 15px;
    border: 3px solid #c49a35;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
}

/* SCHOOL DETAILS */

.logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
}

.school-name {
    font-family: Georgia,serif;
    font-size: 30px;
    font-weight: bold;
    color: #002060;
    margin: 4px;
}

.address {
    font-size: 18px;
    color: #9b741b;
    font-weight: bold;
}

.gold-line {
    width: 75%;
    height: 3px;
    background: linear-gradient(to right,#fff,#c49a35,#fff);
    margin: 5px;
}

/* CERTIFICATE HEADING */

.heading {
    font-family: Georgia,serif;
    font-size: 37px;
    color: #b8860b;
    font-weight: bold;
    margin: 7px;
}

.award-title {
    font-size: 24px;
    color: #002060;
    font-weight: bold;
    padding: 8px 30px;
    border-top: 2px solid #c49a35;
    border-bottom: 2px solid #c49a35;
    margin: 5px;
}

.presented {
    font-size: 17px;
    margin: 5px;
}

/* STUDENT DETAILS */

.student-section {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin: 5px 0;
}

.student-photo-box {
    width: 140px;
    height: 165px;
    padding: 4px;
    border: 4px solid #c49a35;
    outline: 2px solid #002060;
    background: white;
    border-radius: 6px;
    flex-shrink: 0;
}

.student-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.student-details {
    flex: 1;
    text-align: center;
}

.student-name {
    font-family: Georgia,serif;
    font-size: 35px;
    font-weight: bold;
    color: #002060;
    border-bottom: 3px solid #c49a35;
    padding: 7px 15px;
    margin: 7px;
}

.class-text {
    font-size: 20px;
    font-weight: bold;
    color: #002060;
    margin: 7px;
}

.description {
    font-size: 17px;
    line-height: 1.5;
    max-width: 750px;
    margin: 8px auto;
}

.date-text {
    font-weight: bold;
    font-size: 16px;
    margin: 7px;
}

/* FOOTER */

.footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-top: 10px;
    padding: 0 20px;
}

.signature-box {
    width: 200px;
    text-align: center;
    font-weight: bold;
    color: #002060;
}

.principal-sign {
    width: 130px;
    height: 55px;
    object-fit: contain;
    display: block;
    margin: 0 auto 5px;
}

.signature-line {
    border-top: 2px solid #002060;
    padding-top: 7px;
}

.seal {
    width: 90px;
    height: 90px;
    object-fit: contain;
}

/* SCREEN RESPONSIVE */

@media screen and (max-width:700px) {

    .student-section {
        flex-direction: column;
    }

    .school-name {
        font-size: 22px;
    }

    .heading {
        font-size: 27px;
    }

    .student-name {
        font-size: 26px;
    }

    .footer {
        padding: 0;
    }

}

/* A4 LANDSCAPE PRINT */

@media print {

    @page {
        size: A4 landscape;
        margin: 5mm;
    }

    html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 287mm;
        background: white !important;
    }

    body {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .no-print {
        display: none !important;
    }

    #certificateArea {
        margin: 0 !important;
        padding: 0 !important;
        width: 287mm;
    }

    .certificate {
        width: 287mm !important;
        height: 200mm !important;
        min-height: 200mm !important;
        max-height: 200mm !important;

        margin: 0 !important;
        padding: 5px !important;

        border: 10px double #c49a35 !important;
        outline: 2px solid #002060;

        overflow: hidden !important;

        page-break-after: always;
        break-after: page;

        box-sizing: border-box !important;
    }

    .certificate:last-child {
        page-break-after: auto;
        break-after: auto;
    }

    .certificate-inner {
        width: 100%;
        height: 100% !important;
        min-height: 0 !important;

        padding: 6px !important;

        display: flex;
        flex-direction: column;
        justify-content: space-between !important;
        align-items: center;

        gap: 1px;
        overflow: hidden !important;
    }

    .logo {
        width: 65px !important;
        height: 65px !important;
    }

    .school-name {
        font-size: 24px !important;
        margin: 2px !important;
    }

    .address {
        font-size: 15px !important;
    }

    .gold-line {
        margin: 3px !important;
    }

    .heading {
        font-size: 30px !important;
        margin: 3px !important;
    }

    .award-title {
        font-size: 20px !important;
        padding: 5px 20px !important;
        margin: 3px !important;
    }

    .presented {
        font-size: 15px !important;
        margin: 2px !important;
    }

    .student-section {
        gap: 20px !important;
        margin: 2px 0 !important;
    }

    .student-photo-box {
        width: 120px !important;
        height: 140px !important;
        padding: 3px !important;
    }

    .student-name {
        font-size: 28px !important;
        padding: 5px !important;
        margin: 3px !important;
    }

    .class-text {
        font-size: 17px !important;
        margin: 3px !important;
    }

    .description {
        font-size: 14px !important;
        line-height: 1.3 !important;
        margin: 3px auto !important;
    }

    .date-text {
        font-size: 14px !important;
        margin: 3px !important;
    }

    .footer {
        margin-top: 3px !important;
        padding: 0 15px !important;
    }

    .signature-box {
        width: 180px !important;
        font-size: 14px !important;
    }

    .principal-sign {
        width: 110px !important;
        height: 40px !important;
        margin-bottom: 3px !important;
    }

    .seal {
        width: 75px !important;
        height: 75px !important;
    }

    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header no-print">

    <h1>CAMBRIDGE SCHOOL</h1>

    <h2>OF MODERN EDUCATION</h2>

    <h3>OTLIGAM, BEERWAH</h3>

    <h2>STUDENTS AWARD CERTIFICATE</h2>

</div>


<!-- SEARCH AREA -->

<div class="search-box no-print">

    <h2>🔍 Search Student Certificate</h2>

    <input
        type="text"
        id="searchName"
        placeholder="Enter Student Name..."
        onkeydown="if(event.key==='Enter') searchStudent()"
    >

    <button onclick="searchStudent()">Search</button>

    <button onclick="window.print()">
        Print / Save PDF
    </button>

    <p id="message">
        Enter student name to view certificate.
    </p>

</div>


<!-- CERTIFICATE AREA -->

<div id="certificateArea"></div>


<script>

/* STUDENT RECORDS */

const students = [

    {
        name: "Jannat Ul Firdous",

        className: "7th",

        award: "Discipline Award",

        date: "30-10-2026",

        photo: "../Admit-Cards/Annual-Examination-2026-27/Class-7/26CS70009.jpg",

        description:
        "In recognition of excellent discipline, good manners, responsible behaviour and respect for school values."
    },

    {
        name: "Suliam Jaan",

        className: "8th",

        award: "Sports Achievement",

        date: "30-10-2026",

        photo: "",

        description:
        "In recognition of outstanding sports achievement, teamwork, dedication and excellent sporting spirit."
    }

];


/* SEARCH FUNCTION */

function searchStudent() {

    const search = document
        .getElementById("searchName")
        .value.trim().toLowerCase();

    const area = document.getElementById("certificateArea");

    const message = document.getElementById("message");

    area.innerHTML = "";

    if (search === "") {

        message.innerText = "Please enter student name.";

        return;
    }

    const found = students.filter(student =>
        student.name.toLowerCase().includes(search)
    );

    if (found.length === 0) {

        message.innerText = "No student found. Please check the name.";

        return;
    }

    message.innerText =
        found.length + " certificate(s) found.";

    found.forEach(student => {

        const photoHTML = student.photo
        ? `
            <div class="student-photo-box">
                <img
                    src="${student.photo}"
                    class="student-photo"
                    alt="Student Photo"
                    onerror="this.parentElement.style.display='none'"
                >
            </div>
        `
        : "";

        area.innerHTML += `

        <div class="certificate">

            <div class="certificate-inner">

                <img
                    src="../logo.png"
                    class="logo"
                    alt="School Logo"
                >

                <div class="school-name">
                    CAMBRIDGE SCHOOL OF MODERN EDUCATION
                </div>

                <div class="address">
                    OTLIGAM, BEERWAH
                </div>

                <div class="gold-line"></div>

                <div class="heading">
                    CERTIFICATE OF ACHIEVEMENT
                </div>

                <div class="award-title">
                    ${escapeHTML(student.award)}
                </div>

                <div class="presented">
                    This certificate is proudly presented to
                </div>

                <div class="student-section">

                    ${photoHTML}

                    <div class="student-details">

                        <div class="student-name">
                            ${escapeHTML(student.name)}
                        </div>

                        <div class="class-text">
                            Class: ${escapeHTML(student.className)}
                        </div>

                        <div class="description">
                            ${escapeHTML(student.description)}
                        </div>

                    </div>

                </div>

                <div class="date-text">
                    Date: ${escapeHTML(student.date)}
                </div>

                <div class="footer">

                    <div class="signature-box">

                        <div class="signature-line">
                            Exam Incharge
                        </div>

                    </div>

                    <img
                        src="../school-seal.png"
                        class="seal"
                        alt="School Seal"
                    >

                    <div class="signature-box">

                        <img
                            src="../principal-sign.png"
                            class="principal-sign"
                            alt="Principal Signature"
                        >

                        <div class="signature-line">
                            Principal
                        </div>

                    </div>

                </div>

            </div>

        </div>

        `;

    });

    window.scrollTo({
        top: area.offsetTop,
        behavior: "smooth"
    });

}


/* HTML SECURITY */

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

    }[char]));

}

</script>

</body>
</html>
