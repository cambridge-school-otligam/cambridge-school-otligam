<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge School - Award Certificate</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    background:#eaf1fa;
    font-family:Arial,sans-serif;
    color:#092653;
}

/* HEADER */

.header{
    text-align:center;
    background:linear-gradient(135deg,#071b49,#15518e);
    color:white;
    padding:20px;
    border-bottom:5px solid #d5a83e;
    border-radius:12px;
}

.header h1{
    font-family:Georgia,serif;
    font-size:30px;
    margin:5px;
}

.header h2{
    color:#ffdc81;
    margin:5px;
}

/* SEARCH */

.search-box{
    max-width:750px;
    margin:25px auto;
    padding:25px;
    background:white;
    border-radius:12px;
    box-shadow:0 4px 15px #0002;
    text-align:center;
}

.search-box input{
    width:70%;
    padding:14px;
    border:2px solid #c49a35;
    border-radius:7px;
    font-size:16px;
}

button{
    padding:13px 25px;
    background:#092653;
    color:white;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-size:16px;
    margin:8px;
}

button:hover{background:#b8860b}

#message{
    font-weight:bold;
    color:#a00020;
}

/* CERTIFICATE */

#certificateArea{
    margin-top:25px;
}

.certificate{
    width:100%;
    max-width:1200px;
    height:650px;
    margin:20px auto;
    padding:9px;
    position:relative;
    overflow:hidden;
    background:#fffdf5;
    border:7px double #c49a35;
    outline:2px solid #092653;
    outline-offset:-15px;
    box-shadow:0 8px 25px #0002;
}

/* OUTER FRAME */

.certificate-inner{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    border:2px solid #173b72;
    border-radius:65px;
    padding:0 65px 10px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;

    background:
    radial-gradient(ellipse at center,#ffffff 0%,#fffdf6 80%,#f8edcf 100%);
}

/* SIMPLE GOLDEN CURVED BORDER */

.certificate-inner:before{
    content:"";
    position:absolute;
    inset:9px;
    border:3px solid #d4a83e;
    border-radius:60px;
    pointer-events:none;
}

.certificate-inner:after{
    content:"";
    position:absolute;
    inset:15px;
    border:1px solid #bd8c27;
    border-radius:55px;
    pointer-events:none;
}

/* CORNER CURVED DECORATIONS */

.corner{
    position:absolute;
    width:155px;
    height:105px;
    z-index:2;
    pointer-events:none;
}

.corner svg{
    width:100%;
    height:100%;
}

.top-left{top:0;left:0}

.top-right{
    top:0;
    right:0;
    transform:scaleX(-1);
}

.bottom-left{
    bottom:0;
    left:0;
    transform:scaleY(-1);
}

.bottom-right{
    bottom:0;
    right:0;
    transform:scale(-1);
}

/* SIDE SIMPLE CURVES */

.side-curve{
    position:absolute;
    top:22%;
    height:56%;
    width:30px;
    border-radius:50%;
    pointer-events:none;
    z-index:2;
}

.side-left{
    left:8px;
    border-left:3px solid #c49a35;
}

.side-right{
    right:8px;
    border-right:3px solid #c49a35;
}

/* HALF CIRCLE SCHOOL NAME */

.school-top{
    width:100%;
    height:125px;
    flex-shrink:0;
    position:relative;
    z-index:4;
    margin-top:-3px;
}

.school-top svg{
    width:100%;
    height:100%;
    overflow:visible;
}

.curved-name{
    fill:#ffffff;
    font-family:Georgia,serif;
    font-size:29px;
    font-weight:bold;
    letter-spacing:1px;
}

/* SCHOOL LOGO */

.logo{
    width:76px;
    height:76px;
    object-fit:contain;
    z-index:5;
    margin-top:-43px;
    background:#fffdf5;
    border-radius:50%;
}

/* ADDRESS */

.address{
    font-family:Georgia,serif;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    color:#8e5b13;
    z-index:4;
    margin-top:0;
    text-align:center;
}

/* ADDRESS LINES */

.address-row{
    width:75%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    z-index:4;
}

.address-line{
    flex:1;
    height:2px;
    background:linear-gradient(to right,transparent,#bd8b28);
}

.address-line:last-child{
    background:linear-gradient(to left,transparent,#bd8b28);
}

/* GOLDEN HEADING PLAQUE */

.heading-box{
    width:85%;
    padding:7px 20px;
    text-align:center;
    background:linear-gradient(
        90deg,#f5d77d,#fff0bb,#e9bd4b,#fff0bb,#f5d77d
    );
    border:4px double #bd8b22;
    border-radius:40px;
    box-shadow:0 3px 6px #0002;
    position:relative;
    z-index:4;
}

.heading{
    font-family:Georgia,serif;
    font-size:36px;
    font-weight:bold;
    color:#092653;
    margin:0;
    letter-spacing:1px;
}

.heading-box:before,
.heading-box:after{
    content:"★";
    position:absolute;
    top:9px;
    color:#174b88;
    font-size:22px;
}

.heading-box:before{left:24px}
.heading-box:after{right:24px}

/* AWARD RIBBON */

.award-title{
    position:relative;
    min-width:65%;
    text-align:center;
    background:linear-gradient(
        90deg,#061b49,#1554a0,#061b49
    );
    color:#ffffff;
    font-family:Georgia,serif;
    font-size:25px;
    font-weight:bold;
    font-style:italic;
    padding:9px 55px;
    margin:0;
    border-top:4px solid #eac45e;
    border-bottom:4px solid #eac45e;
    box-shadow:0 4px 8px #0003;
    z-index:4;
}

.award-title:before,
.award-title:after{
    content:"★";
    position:absolute;
    top:8px;
    color:#ffd45d;
    font-size:22px;
}

.award-title:before{left:20px}
.award-title:after{right:20px}

/* PRESENTED TEXT */

.presented{
    font-family:Georgia,serif;
    font-size:19px;
    font-style:italic;
    color:#172d59;
    margin:0;
    z-index:4;
}

/* STUDENT SECTION */

.student-section{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:30px;
    margin:0;
    z-index:4;
}

.student-photo-box{
    width:140px;
    height:175px;
    padding:5px;
    flex-shrink:0;
    border:5px double #c49a35;
    outline:2px solid #173b72;
    background:white;
    box-shadow:0 3px 10px #0002;
}

.student-photo{
    width:100%;
    height:100%;
    object-fit:cover;
}

.student-details{
    flex:1;
    text-align:center;
}

.student-name{
    font-family:Georgia,serif;
    font-size:39px;
    font-weight:bold;
    color:#092653;
    border-bottom:3px solid #c49a35;
    padding:5px 10px;
    margin:4px;
}

.class-text{
    display:inline-block;
    font-family:Georgia,serif;
    font-size:25px;
    font-weight:bold;
    font-style:italic;
    color:#092653;
    border:3px solid #c49a35;
    border-radius:30px;
    padding:4px 45px;
    margin:5px;
}

.description{
    font-family:Georgia,serif;
    font-style:italic;
    font-size:18px;
    line-height:1.4;
    max-width:750px;
    margin:5px auto;
    color:#172d59;
}

/* DATE */

.date-text{
    font-family:Georgia,serif;
    font-size:21px;
    font-weight:bold;
    color:#8d5416;
    padding:5px 25px;
    background:linear-gradient(90deg,#f6dc8d,#fff0b8,#f6dc8d);
    border:2px solid #c49a35;
    border-radius:25px;
    margin:0;
    z-index:4;
}

/* FOOTER */

.footer{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin:0;
    padding:0 10px;
    z-index:4;
}

.signature-box{
    width:200px;
    text-align:center;
    font-weight:bold;
    color:#092653;
    font-size:18px;
}

.principal-sign{
    width:135px;
    height:50px;
    object-fit:contain;
    display:block;
    margin:0 auto 3px;
}

.signature-line{
    border-top:2px solid #092653;
    padding-top:6px;
}

.seal{
    width:100px;
    height:100px;
    object-fit:contain;
}

/* MOBILE */

@media(max-width:700px){

    .certificate{
        height:auto;
        min-height:700px;
    }

    .certificate-inner{
        padding:5px 25px 15px;
        border-radius:35px;
    }

    .school-top{height:90px}

    .curved-name{font-size:18px}

    .logo{
        width:60px;
        height:60px;
        margin-top:-28px;
    }

    .heading{font-size:23px}

    .heading-box{width:95%}

    .award-title{
        font-size:18px;
        padding:8px 35px;
    }

    .student-section{
        flex-direction:column;
    }

    .student-name{font-size:27px}

    .class-text{font-size:19px}

    .description{font-size:15px}

    .footer{padding:0}

    .signature-box{
        width:105px;
        font-size:12px;
    }

    .seal{
        width:60px;
        height:60px;
    }

    .corner{
        width:75px;
        height:60px;
    }
}

/* A4 LANDSCAPE PRINT */

@media print{

    @page{
        size:A4 landscape;
        margin:0;
    }

    html,body{
        width:297mm!important;
        height:auto!important;
        margin:0!important;
        padding:0!important;
        background:white!important;
    }

    .no-print{display:none!important}

    #certificateArea{
        width:297mm!important;
        margin:0!important;
        padding:0!important;
    }

    .certificate{
        width:297mm!important;
        height:210mm!important;
        min-height:210mm!important;
        max-height:210mm!important;
        max-width:none!important;
        margin:0!important;
        padding:5mm!important;

        border:3mm double #c49a35!important;
        outline:1px solid #092653!important;
        outline-offset:-4mm!important;

        overflow:hidden!important;
        box-sizing:border-box!important;

        page-break-after:always;
        break-after:page;

        -webkit-print-color-adjust:exact!important;
        print-color-adjust:exact!important;
    }

    .certificate:last-child{
        page-break-after:auto;
        break-after:auto;
    }

    .certificate-inner{
        height:100%!important;
        width:100%!important;
        padding:0mm 12mm 2mm!important;
        border-radius:18mm!important;
        justify-content:space-between!important;
        overflow:hidden!important;
    }

    .certificate-inner:before{
        inset:2mm!important;
        border-radius:17mm!important;
    }

    .certificate-inner:after{
        inset:4mm!important;
        border-radius:15mm!important;
    }

    .corner{
        width:35mm!important;
        height:24mm!important;
    }

    .side-curve{
        top:22%!important;
        height:56%!important;
    }

    .school-top{
        height:31mm!important;
        flex-shrink:0;
    }

    .curved-name{font-size:29px!important}

    .logo{
        width:18mm!important;
        height:18mm!important;
        margin-top:-11mm!important;
    }

    .address{
        font-size:15px!important;
        margin-top:0!important;
    }

    .heading-box{
        padding:3px 20px!important;
        width:85%!important;
    }

    .heading{font-size:30px!important}

    .award-title{
        font-size:21px!important;
        padding:5px 45px!important;
    }

    .presented{font-size:16px!important}

    .student-section{
        gap:20px!important;
    }

    .student-photo-box{
        width:33mm!important;
        height:41mm!important;
        padding:2px!important;
    }

    .student-name{
        font-size:30px!important;
        padding:3px!important;
    }

    .class-text{
        font-size:19px!important;
        padding:3px 35px!important;
        margin:2px!important;
    }

    .description{
        font-size:14px!important;
        line-height:1.3!important;
        margin:3px auto!important;
    }

    .date-text{
        font-size:17px!important;
        padding:3px 22px!important;
    }

    .signature-box{
        width:180px!important;
        font-size:15px!important;
    }

    .principal-sign{
        width:115px!important;
        height:38px!important;
    }

    .seal{
        width:23mm!important;
        height:23mm!important;
    }

    *{
        -webkit-print-color-adjust:exact!important;
        print-color-adjust:exact!important;
    }
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header no-print">
    <h1>CAMBRIDGE SCHOOL</h1>
    <h2>OF MODERN EDUCATION</h2>
    <h3>OTLIGAM, BEERWAH</h3>
    <h2>STUDENTS AWARD CERTIFICATE</h2>
</div>

<!-- SEARCH -->

<div class="search-box no-print">

    <h2>🔍 Search Student Certificate</h2>

    <input
        type="text"
        id="searchName"
        placeholder="Enter Student Name..."
        onkeydown="if(event.key==='Enter') searchStudent()"
    >

    <button onclick="searchStudent()">Search</button>

    <button onclick="printCertificate()">
        Print / Save PDF
    </button>

    <p id="message">
        Enter student name to view certificate.
    </p>

</div>

<!-- CERTIFICATE AREA -->

<div id="certificateArea"></div>

<script>

/* STUDENT RECORDS */

const students = [

    {
        name:"Jannat Ul Firdous",
        className:"7th",
        award:"Discipline Award",
        date:"30-10-2026",

        photo:"../Admit-Cards/Annual-Examination-2026-27/Class-7/26CS70009.jpg",

        description:
        "In recognition of excellent discipline, good manners, responsible behaviour and respect for school values."
    },

    {
        name:"Suliam Jaan",
        className:"8th",
        award:"Sports Achievement",
        date:"30-10-2026",

        photo:"",

        description:
        "In recognition of outstanding sports achievement, teamwork, dedication and excellent sporting spirit."
    }

];


/* CORNER DESIGN */

const cornerSVG = `

<svg viewBox="0 0 160 110"
xmlns="http://www.w3.org/2000/svg">

    <path d="M2 105 Q5 8 155 3"
        fill="none"
        stroke="#c49a35"
        stroke-width="5"/>

    <path d="M2 90 Q10 18 140 12"
        fill="none"
        stroke="#092653"
        stroke-width="8"/>

    <path d="M8 75 Q18 28 125 22"
        fill="none"
        stroke="#e4bd62"
        stroke-width="2"/>

    <path d="M15 12 Q40 5 60 22
             M12 24 Q35 15 48 30"
        fill="none"
        stroke="#c49a35"
        stroke-width="2"/>

    <circle cx="18" cy="17" r="5" fill="#d4a638"/>
    <circle cx="35" cy="12" r="3" fill="#153c76"/>

</svg>

`;


/* CREATE CERTIFICATE */

function createCertificate(student){

    const photoHTML = student.photo
    ? `
        <div class="student-photo-box">
            <img
                src="${escapeHTML(student.photo)}"
                class="student-photo"
                alt="Student Photo"
                onerror="this.parentElement.style.display='none'"
            >
        </div>
    `
    : "";

    return `

    <div class="certificate">

        <div class="certificate-inner">

            <!-- CORNER DECORATIONS -->

            <div class="corner top-left">${cornerSVG}</div>
            <div class="corner top-right">${cornerSVG}</div>
            <div class="corner bottom-left">${cornerSVG}</div>
            <div class="corner bottom-right">${cornerSVG}</div>

            <!-- SIDE CURVES -->

            <div class="side-curve side-left"></div>
            <div class="side-curve side-right"></div>

            <!-- CURVED SCHOOL NAME -->

            <div class="school-top">

                <svg viewBox="0 0 1000 180"
                     xmlns="http://www.w3.org/2000/svg">

                    <defs>
                        <path id="schoolArc"
                              d="M 100 155 Q 500 -45 900 155"/>
                    </defs>

                    <!-- BLUE CURVED BAND -->

                    <path
                        d="M 75 155 Q 500 -75 925 155
                           L 890 185 Q 500 -35 110 185 Z"
                        fill="#092653"
                        stroke="#d4a83e"
                        stroke-width="7"
                    />

                    <path
                        d="M 95 154 Q 500 -50 905 154"
                        fill="none"
                        stroke="#e7c46d"
                        stroke-width="2"
                    />

                    <text
                        class="curved-name"
                        text-anchor="middle">

                        <textPath href="#schoolArc"
                                  startOffset="50%">

                            CAMBRIDGE SCHOOL OF MODERN EDUCATION

                        </textPath>

                    </text>

                </svg>

            </div>

            <!-- SCHOOL LOGO -->

            <img
                src="../logo.png"
                class="logo"
                alt="School Logo"
            >

            <!-- ADDRESS -->

            <div class="address-row">

                <div class="address-line"></div>

                <div class="address">
                    OTLIGAM, BEERWAH
                </div>

                <div class="address-line"></div>

            </div>

            <!-- MAIN HEADING -->

            <div class="heading-box">

                <div class="heading">
                    CERTIFICATE OF ACHIEVEMENT
                </div>

            </div>

            <!-- AWARD RIBBON -->

            <div class="award-title">
                ${escapeHTML(student.award)}
            </div>

            <!-- PRESENTED -->

            <div class="presented">
                This certificate is proudly presented to
            </div>

            <!-- STUDENT INFORMATION -->

            <div class="student-section">

                ${photoHTML}

                <div class="student-details">

                    <div class="student-name">
                        ${escapeHTML(student.name)}
                    </div>

                    <div class="class-text">
                        Class: ${escapeHTML(student.className)}
                    </div>

                    <div class="description">
                        ${escapeHTML(student.description)}
                    </div>

                </div>

            </div>

            <!-- DATE -->

            <div class="date-text">
                Date: ${escapeHTML(student.date)}
            </div>

            <!-- FOOTER -->

            <div class="footer">

                <div class="signature-box">

                    <div class="signature-line">
                        Exam Incharge
                    </div>

                </div>

                <img
                    src="../school-seal.png"
                    class="seal"
                    alt="School Seal"
                >

                <div class="signature-box">

                    <img
                        src="../principal-sign.png"
                        class="principal-sign"
                        alt="Principal Signature"
                    >

                    <div class="signature-line">
                        Principal
                    </div>

                </div>

            </div>

        </div>

    </div>

    `;
}


/* SEARCH FUNCTION */

function searchStudent(){

    const search = document
        .getElementById("searchName")
        .value.trim().toLowerCase();

    const area = document.getElementById("certificateArea");

    const message = document.getElementById("message");

    area.innerHTML = "";

    if(search === ""){

        message.innerText = "Please enter student name.";

        return;
    }

    const found = students.filter(student =>
        student.name.toLowerCase().includes(search)
    );

    if(found.length === 0){

        message.innerText =
        "No student found. Please check the name.";

        return;
    }

    message.innerText =
    found.length + " certificate(s) found.";

    area.innerHTML = found.map(createCertificate).join("");

    window.scrollTo({
        top:area.offsetTop,
        behavior:"smooth"
    });

}


/* PRINT FUNCTION */

async function printCertificate(){

    const area = document.getElementById("certificateArea");

    if(!area.innerHTML.trim()){

        alert("Please search a student first.");

        return;
    }

    const images = Array.from(area.querySelectorAll("img"));

    await Promise.all(images.map(img => {

        if(img.complete){
            return Promise.resolve();
        }

        return new Promise(resolve => {

            img.onload = resolve;
            img.onerror = resolve;

            setTimeout(resolve,5000);

        });

    }));

    window.print();

}


/* HTML SECURITY */

function escapeHTML(value){

    return String(value).replace(/[&<>"']/g,char => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

    }[char]));

}

</script>

</body>
</html>
