#message {

.certificate {

/* INNER BORDER */

.certificate-inner {
    min-height: 600px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;

    background:

}

/* DECORATIVE FLORAL CORNERS */

.corner {
    position: absolute;
    width: 125px;
    height: 125px;
    z-index: 3;
    pointer-events: none;
}

.corner svg {
    width: 100%;
    height: 100%;
}

.top-left {
    top: 5px;
    left: 5px;
}

.top-right {
    top: 5px;
    right: 5px;
    transform: scaleX(-1);
}

.bottom-left {
    bottom: 5px;
    left: 5px;
    transform: scaleY(-1);
}

.bottom-right {
    bottom: 5px;
    right: 5px;
    transform: scale(-1);
}

/* SIDE DECORATIONS */

.side-decoration {
    position: absolute;
    top: 23%;
    height: 55%;
    width: 65px;
    z-index: 2;
    pointer-events: none;
}

.side-left {
    left: 4px;
}

.side-right {
    right: 4px;
    transform: scaleX(-1);
}

.side-decoration svg {
    width: 100%;
    height: 100%;
}

/* SCHOOL LOGO */

.logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    z-index: 4;
}

/* SCHOOL NAME */

.school-name {
    font-family: Georgia,serif;
    font-size: 29px;
    font-weight: bold;
    color: #002060;
    text-align: center;
    margin: 2px;
    z-index: 4;
}

.address {
    font-size: 18px;
    color: #9b741b;
    font-weight: bold;
    z-index: 4;
}

.gold-line {
    width: 65%;
    height: 3px;
    background: linear-gradient(to right,transparent,#c49a35,transparent);
    margin: 3px;
}

/* MAIN HEADING */

.heading {
    font-family: Georgia,serif;
    font-size: 38px;
    color: #b8860b;
    font-weight: bold;
    text-align: center;
    margin: 5px;

    z-index: 4;
}

/* AWARD RIBBON */

.award-title {
    position: relative;
    background: linear-gradient(90deg,#001747,#0755a0,#001747);

    font-size: 24px;
    font-weight: bold;
    font-style: italic;

    padding: 10px 50px;
    margin: 5px 0;

    border-top: 3px solid #e3bd50;
    border-bottom: 3px solid #e3bd50;

    box-shadow: 0 3px 8px #0003;
    z-index: 4;
}

.award-title::before,
.award-title::after {
    position: absolute;
    content: "★";
    color: #ffd45e;
    top: 8px;
    font-size: 20px;
}

.award-title::before {
    left: 15px;
}

.award-title::after {
    right: 15px;
}

.presented {
    font-family: Georgia,serif;
    font-size: 19px;
    font-style: italic;
    margin: 5px;
    z-index: 4;
}

.student-details {

.student-name {

.class-text {

.description {

.date-text {

/* SEARCH FUNCTION */

function searchStudent() {

    const search = document
        .getElementById("searchName")
        .value.trim().toLowerCase();

    const area = document.getElementById("certificateArea");

    const message = document.getElementById("message");

    area.innerHTML = "";

    if (search === "") {

        message.innerText = "Please enter student name.";

        return;
    }

    const found = students.filter(student =>
        student.name.toLowerCase().includes(search)
    );

    if (found.length === 0) {

        message.innerText =
        "No student found. Please check the name.";

        return;
    }

    message.innerText =
    found.length + " certificate(s) found.";

    area.innerHTML = found.map(createCertificate).join("");

    window.scrollTo({
        top: area.offsetTop,
        behavior: "smooth"
    });

}


/* PRINT FUNCTION */

async function printCertificate() {

    const area = document.getElementById("certificateArea");

    if (!area.innerHTML.trim()) {

        alert("Please search a student first.");

        return;
    }

    const images = Array.from(area.querySelectorAll("img"));

    await Promise.all(images.map(img => {

        if (img.complete) {
            return Promise.resolve();
        }

        return new Promise(resolve => {

            img.onload = resolve;
            img.onerror = resolve;

            setTimeout(resolve, 4000);

        });

    }));

    window.print();

}


/* HTML SECURITY */

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

    }[char]));

}
