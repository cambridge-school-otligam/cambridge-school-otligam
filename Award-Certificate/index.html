<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge School - Award Certificate</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #e9eef7;
    font-family: Georgia, "Times New Roman", serif;
    color: #142b50;
}

.controls {
    max-width: 1100px;
    margin: 0 auto 18px;
    padding: 15px;
    background: white;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: 0 3px 12px #00000015;
}

.controls input {
    padding: 11px 14px;
    width: 260px;
    border: 1px solid #b8c4d8;
    border-radius: 6px;
    font-size: 15px;
}

.controls button {
    padding: 11px 20px;
    border: none;
    border-radius: 6px;
    background: #12356b;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.controls button:hover {
    background: #bd8b2e;
}

#message {
    width: 100%;
    text-align: center;
    color: #a02b2b;
    font-family: Arial, sans-serif;
}

/* CERTIFICATE */

.certificate {
    position: relative;
    width: 297mm;
    height: 210mm;
    max-width: 100%;
    min-height: 720px;
    margin: auto;
    padding: 17px;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #fffef9 0%, #fffdf4 72%, #f5ead0 100%);
    box-shadow: 0 5px 25px #142b5030;
    page-break-after: always;
}

/* OUTER AND INNER BORDER */

.outer-border {
    position: absolute;
    inset: 7px;
    border: 5px solid #12356b;
    pointer-events: none;
}

.inner-border {
    position: absolute;
    inset: 15px;
    border: 2px solid #c59a43;
    pointer-events: none;
}

.third-border {
    position: absolute;
    inset: 21px;
    border: 1px solid #12356b;
    pointer-events: none;
}

/* DECORATIVE CORNERS */

.corner {
    position: absolute;
    width: 95px;
    height: 95px;
    border-color: #c59a43;
    border-style: solid;
    z-index: 2;
}

.corner.tl {
    top: 22px;
    left: 22px;
    border-width: 5px 0 0 5px;
}

.corner.tr {
    top: 22px;
    right: 22px;
    border-width: 5px 5px 0 0;
}

.corner.bl {
    bottom: 22px;
    left: 22px;
    border-width: 0 0 5px 5px;
}

.corner.br {
    bottom: 22px;
    right: 22px;
    border-width: 0 5px 5px 0;
}

/* CONTENT */

.content {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 7px 45px 8px;
}

/* SCHOOL HEADER */

.school-ribbon {
    width: 85%;
    max-width: 850px;
    min-height: 65px;
    background: linear-gradient(135deg, #0b2854, #1c4c8b, #0b2854);
    color: #fff;
    padding: 12px 25px;
    border: 3px solid #d5ad5b;
    outline: 1px solid #12356b;
    outline-offset: 3px;
    border-radius: 0 0 45px 45px;
    box-shadow: 0 5px 10px #00000020;
}

.school-ribbon h1 {
    margin: 0;
    font-size: clamp(17px, 2.4vw, 27px);
    letter-spacing: 1.5px;
    font-weight: bold;
    text-transform: uppercase;
    color: #fff5d9;
}

.school-address {
    margin-top: 5px;
    font: bold 12px Arial, sans-serif;
    letter-spacing: 3px;
    color: #f2d58e;
}

/* LOGO */

.logo {
    width: 76px;
    height: 76px;
    object-fit: contain;
    margin-top: 13px;
    border-radius: 50%;
    background: white;
    padding: 3px;
    border: 3px solid #c59a43;
    box-shadow: 0 2px 8px #00000020;
}

/* CERTIFICATE TITLE */

.certificate-title {
    margin-top: 8px;
    padding: 8px 48px;
    background: linear-gradient(90deg, #b78325, #f5d98e, #b78325);
    border: 2px solid #9c6e1c;
    color: #102b55;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 4px;
    text-transform: uppercase;
    box-shadow: 0 3px 6px #00000015;
}

.subtitle {
    margin: 7px 0 3px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: #8d6928;
    font-weight: bold;
}

/* AWARD RIBBON */

.award-ribbon {
    position: relative;
    min-width: 290px;
    max-width: 90%;
    margin: 7px auto 5px;
    padding: 9px 35px;
    color: #fff7dd;
    background: linear-gradient(90deg, #a91e32, #d23b48, #a91e32);
    border-top: 2px solid #edc66e;
    border-bottom: 2px solid #edc66e;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 3px 7px #00000020;
}

.award-ribbon:before,
.award-ribbon:after {
    content: "";
    position: absolute;
    top: 0;
    width: 0;
    height: 0;
    border-top: 20px solid #7d1726;
    border-bottom: 20px solid #7d1726;
}

.award-ribbon:before {
    left: -17px;
    border-left: 17px solid transparent;
}

.award-ribbon:after {
    right: -17px;
    border-right: 17px solid transparent;
}

/* BODY */

.recognition {
    margin: 5px 0 2px;
    font-size: 17px;
    font-style: italic;
    color: #49556b;
}

.student-name {
    margin: 4px 0 5px;
    padding: 0 15px 5px;
    min-width: 340px;
    border-bottom: 2px solid #c59a43;
    color: #102d5c;
    font-size: 35px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.details {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 55px;
    margin: 4px 0 5px;
    font-family: Arial, sans-serif;
    font-size: 16px;
    color: #253e63;
}

.details strong {
    color: #a27424;
}

.description {
    max-width: 820px;
    margin: 5px auto 7px;
    color: #384a64;
    font-size: 16px;
    line-height: 1.5;
}

/* STUDENT PHOTO */

.student-photo {
    width: 82px;
    height: 94px;
    object-fit: cover;
    border: 3px solid #c59a43;
    padding: 3px;
    background: white;
    border-radius: 5px;
    margin: 3px 0;
    display: none;
}

/* FOOTER */

.footer {
    width: 100%;
    margin-top: auto;
    padding: 5px 25px 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: end;
    gap: 15px;
}

.signature-box {
    min-height: 78px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #18345e;
    font-weight: bold;
}

.signature-box img {
    max-width: 130px;
    max-height: 45px;
    object-fit: contain;
    margin-bottom: 3px;
}

.signature-line {
    width: 165px;
    border-top: 1.5px solid #18345e;
    padding-top: 5px;
}

.seal {
    width: 82px;
    height: 82px;
    object-fit: contain;
    margin: 0 auto 2px;
}

.date {
    position: absolute;
    left: 65px;
    bottom: 42px;
    font: bold 14px Arial, sans-serif;
    color: #18345e;
}

.date span {
    color: #a27424;
}

/* SMALL DECORATIVE TEXT */

.bottom-motto {
    position: absolute;
    bottom: 16px;
    left: 0;
    right: 0;
    color: #9c772e;
    font-size: 11px;
    letter-spacing: 2px;
    font-style: italic;
}

/* MOBILE */

@media screen and (max-width: 750px) {
    body {
        padding: 8px;
    }

    .certificate {
        width: 100%;
        height: auto;
        min-height: 760px;
        padding: 15px 5px;
    }

    .content {
        padding: 7px 24px 10px;
    }

    .school-ribbon {
        width: 95%;
    }

    .school-ribbon h1 {
        font-size: 17px;
    }

    .certificate-title {
        font-size: 19px;
        letter-spacing: 2px;
        padding: 8px 15px;
    }

    .student-name {
        min-width: 0;
        width: 95%;
        font-size: 25px;
    }

    .award-ribbon {
        min-width: 220px;
        font-size: 17px;
    }

    .details {
        gap: 18px;
        flex-wrap: wrap;
        font-size: 14px;
    }

    .description {
        font-size: 14px;
    }

    .footer {
        padding: 5px 0;
        gap: 5px;
    }

    .signature-box {
        font-size: 10px;
    }

    .signature-line {
        width: 95px;
    }

    .seal {
        width: 60px;
        height: 60px;
    }

    .date {
        position: static;
        margin-top: 12px;
        align-self: flex-start;
    }

    .bottom-motto {
        position: static;
        margin-top: 10px;
        font-size: 9px;
    }
}

/* PRINT */

@page {
    size: A4 landscape;
    margin: 0;
}

@media print {
    html, body {
        width: 297mm;
        height: 210mm;
        margin: 0;
        padding: 0;
        background: white;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .controls {
        display: none !important;
    }

    .certificate {
        width: 297mm;
        height: 210mm;
        min-height: 0;
        max-width: none;
        margin: 0;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .certificate:last-child {
        page-break-after: auto;
        break-after: auto;
    }
}
</style>
</head>

<body>

<div class="controls">
    <input
        type="text"
        id="searchInput"
        placeholder="Enter student name or roll number"
        onkeydown="if(event.key==='Enter') searchStudent()"
    >
    <button onclick="searchStudent()">Search Student</button>
    <button onclick="printCertificate()">Print / Save PDF</button>
    <div id="message"></div>
</div>

<div id="certificates"></div>

<script>

/* SCHOOL AND STUDENT DETAILS */

const students = [
    {
        name: "Jannat Ul Firdous",
        className: "7th",
        award: "Discipline Award",
        date: "30-10-2026",
        roll: "26CS70009",
        photo: "../Admit-Cards/Annual-Examination-2026-27/Class-7/26CS70009.jpg",
        description: "In recognition of excellent discipline, good manners, responsible behaviour and respect for school values."
    },
    {
        name: "Suliam Jaan",
        className: "8th",
        award: "Sports Achievement",
        date: "30-10-2026",
        roll: "",
        photo: "",
        description: "In recognition of outstanding sports achievement, teamwork, dedication and excellent sporting spirit."
    }
];

/* HTML SECURITY */

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

/* CERTIFICATE TEMPLATE */

function certificateHTML(student) {

    const photoHTML = student.photo
        ? `<img class="student-photo" src="${escapeHTML(student.photo)}"
             alt="Student Photo" onload="this.style.display='block'"
             onerror="this.style.display='none'">`
        : "";

    return `
    <section class="certificate">

        <div class="outer-border"></div>
        <div class="inner-border"></div>
        <div class="third-border"></div>

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="content">

            <header class="school-ribbon">
                <h1>CAMBRIDGE SCHOOL OF MODERN EDUCATION</h1>
                <div class="school-address">OTLIGAM, BEERWAH</div>
            </header>

            <img class="logo"
                 src="../logo.png"
                 alt="School Logo"
                 onerror="this.style.visibility='hidden'">

            <div class="certificate-title">
                Certificate of Achievement
            </div>

            <div class="subtitle">
                RECOGNITION OF EXCELLENCE
            </div>

            <div class="award-ribbon">
                ${escapeHTML(student.award)}
            </div>

            <p class="recognition">
                This certificate is proudly presented to
            </p>

            <div class="student-name">
                ${escapeHTML(student.name)}
            </div>

            <div class="details">
                <div><strong>CLASS:</strong> ${escapeHTML(student.className)}</div>
                ${student.roll ? `<div><strong>ROLL NO:</strong> ${escapeHTML(student.roll)}</div>` : ""}
            </div>

            ${photoHTML}

            <div class="description">
                ${escapeHTML(student.description)}
            </div>

            <div class="footer">

                <div class="signature-box">
                    <div class="signature-line">
                        Signature of Exam Incharge
                    </div>
                </div>

                <div class="signature-box">
                    <img class="seal"
                         src="../school-seal.png"
                         alt="School Seal"
                         onerror="this.style.visibility='hidden'">
                    <div>OFFICIAL SCHOOL SEAL</div>
                </div>

                <div class="signature-box">
                    <img src="../principal-sign.png"
                         alt="Principal Signature"
                         onerror="this.style.visibility='hidden'">
                    <div class="signature-line">
                        Signature of Principal
                    </div>
                </div>

            </div>

            <div class="date">
                <span>DATE:</span> ${escapeHTML(student.date)}
            </div>

            <div class="bottom-motto">
                QUALITY EDUCATION TODAY, BRIGHT FUTURE TOMORROW
            </div>

        </div>
    </section>
    `;
}

/* DISPLAY ALL CERTIFICATES */

function showAllCertificates() {
    document.getElementById("certificates").innerHTML =
        students.map(certificateHTML).join("");
    document.getElementById("message").textContent = "";
}

/* SEARCH STUDENT */

function searchStudent() {

    const query = document
        .getElementById("searchInput")
        .value.trim()
        .toLowerCase();

    const message = document.getElementById("message");

    if (!query) {
        showAllCertificates();
        return;
    }

    const results = students.filter(student =>
        student.name.toLowerCase().includes(query) ||
        student.className.toLowerCase().includes(query) ||
        student.roll.toLowerCase().includes(query)
    );

    if (results.length === 0) {
        document.getElementById("certificates").innerHTML = "";
        message.textContent = "No student found. Please check the name or roll number.";
        return;
    }

    message.textContent = "";
    document.getElementById("certificates").innerHTML =
        results.map(certificateHTML).join("");
}

/* PRINT AND SAVE PDF */

function printCertificate() {

    const certificates = document.querySelectorAll(".certificate");

    if (!certificates.length) {
        alert("Please search for a student first.");
        return;
    }

    const images = Array.from(document.querySelectorAll(".certificate img"));

    const imagePromises = images.map(img => {
        if (img.complete) return Promise.resolve();

        return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
        });
    });

    Promise.all(imagePromises).then(() => {
        window.print();
    });
}

/* INITIAL DISPLAY */

showAllCertificates();

</script>

</body>
</html>
